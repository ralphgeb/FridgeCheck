<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Scout numbers</title>
<!-- Scout's numbers in Scout's own look, live from the Scout service (/stats.json). -->
<style>
:root{--bg:#F5F6F8;--card:#fff;--ink:#131B2C;--dim:rgba(19,27,44,.5);--faint:rgba(19,27,44,.08);--accent:#E25555}
@media(prefers-color-scheme:dark){:root{--bg:#0B0F18;--card:#161D2C;--ink:#EEF0F4;--dim:rgba(238,240,244,.5);--faint:rgba(238,240,244,.08)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 48px}header{display:flex;gap:12px;align-items:center}header svg{border-radius:9px;flex:none}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:0;color:var(--ink)}.sub{color:var(--dim);font-size:13px}
h2{font-size:22px;font-weight:800;letter-spacing:-.4px;color:var(--accent);margin:26px 2px 10px}
.card,.t{background:var(--card);border-radius:22px;padding:16px}.card+.card{margin-top:10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.l{color:var(--dim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.v{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}.of{font-size:14px;font-weight:600;color:var(--dim)}
.n{color:var(--dim);font-size:12.5px;margin-top:4px}.bar{height:8px;border-radius:5px;background:var(--faint);overflow:hidden;margin:10px 0 2px}.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
ol{margin:0;padding-left:22px}li{padding:6px 0;border-bottom:1px solid var(--faint)}li:last-child{border:0}li span{color:var(--dim);font-size:12.5px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--faint)}th:first-child,td:first-child{text-align:left}th{color:var(--dim);font-size:11.5px}tr:last-child td{border:0}
.err{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header><svg viewBox="0 0 1024 1024" width="34" height="34" aria-hidden="true"><rect width="1024" height="1024" rx="230" fill="#131B2C"/><g stroke="#fff" stroke-width="30" stroke-linecap="round"><line x1="530" y1="500" x2="330" y2="286"/><line x1="530" y1="500" x2="706" y2="332"/><line x1="530" y1="500" x2="298" y2="510"/><line x1="530" y1="500" x2="426" y2="762"/><line x1="530" y1="500" x2="706" y2="670"/></g><circle cx="330" cy="286" r="70" fill="#fff"/><circle cx="706" cy="332" r="76" fill="#E25555"/><circle cx="298" cy="510" r="44" fill="#9AA3B2"/><circle cx="426" cy="762" r="58" fill="#fff"/><circle cx="706" cy="670" r="54" fill="#fff"/><circle cx="530" cy="500" r="92" fill="#fff"/></svg><div><h1>Scout numbers</h1><div class="sub" id="sub">Loading…</div></div></header>
  <h2>Voice</h2>
  <div id="voice"></div>
  <h2>Listening</h2>
  <div class="g" id="plays"></div>
  <h2>Most played this month</h2>
  <div class="card" id="top"></div>
  <h2>News</h2>
  <div class="g" id="news"></div>
  <h2>Last 14 days</h2>
  <div class="card tbl"><table><thead><tr><th>Day</th><th>Updates</th><th>New stories</th><th>AI requests</th><th>Characters</th></tr></thead><tbody id="days"></tbody></table></div>
</div>
<script>
  const SOURCE = 'https://scout-stocks.ralph-gebara.workers.dev/stats.json';
  const fmt = (n) => Number(n || 0).toLocaleString('en-GB');
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const tile = (label, value, note = '') => `<div class="t"><div class="l">${label}</div><div class="v">${value}</div>${note ? `<div class="n">${note}</div>` : ''}</div>`;
  const meter = (name, a, note) => `<div class="card"><div class="l">${name}</div><div class="v">${fmt(a.chars)} <span class="of">of ${fmt(a.free)} free</span></div>
    <div class="bar"><i style="width:${Math.min(100, a.chars / a.free * 100).toFixed(1)}%"></i></div>
    <div class="n">${a.over ? `About £${a.costGBP.toFixed(2)} over the free allowance` : `Inside the free allowance · ${fmt(a.free - a.chars)} left`} · ${note}</div></div>`;
  const $ = (id) => document.getElementById(id);

  async function load() {
    try {
      const r = await fetch(SOURCE, { cache: 'no-store' });
      if (!r.ok) throw new Error(`the Scout service answered ${r.status}`);
      const d = await r.json();
      const month = new Date(d.month + '-01T00:00:00Z').toLocaleDateString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' });
      const updated = d.updated ? new Date(d.updated).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : 'not yet';
      $('sub').textContent = `${month} · last news update ${updated}`;
      const v = d.voice;
      $('voice').innerHTML =
        meter('Chirp 3: HD · briefings and the top 10', v.chirp, `${fmt(v.briefings.recordings)} briefings, ${fmt(v.storiesAhead.stories)} stories`) +
        meter('WaveNet · stories played on demand', v.wavenet, `${fmt(v.onDemand.stories)} stories, up to ${fmt(v.onDemand.dailyCap)} a day`);
      $('plays').innerHTML = tile('Briefings played', fmt(d.plays.briefings)) + tile('Stories played', fmt(d.plays.stories));
      $('top').innerHTML = d.plays.top.length
        ? `<ol>${d.plays.top.map((t) => `<li>${esc(t.title)} <span>· ${esc(t.kind)} · ${fmt(t.n)}</span></li>`).join('')}</ol>`
        : '<div class="n">Nothing played yet this month.</div>';
      const n = d.news;
      $('news').innerHTML = tile('Updates', fmt(n.runs)) + tile('New stories', fmt(n.added)) + tile('Merged', fmt(n.merged)) +
        tile('Skipped', fmt(n.skipped)) + tile('AI requests', fmt(n.aiRequests));
      $('days').innerHTML = d.days.length
        ? d.days.map((x) => `<tr><td>${x.day.slice(8)}/${x.day.slice(5, 7)}</td><td>${fmt(x.runs)}</td><td>${fmt(x.added)}</td><td>${fmt(x.aiRequests)}</td><td>${fmt(x.chars)}</td></tr>`).join('')
        : '<tr><td colspan="5">No days yet.</td></tr>';
    } catch (e) {
      $('sub').innerHTML = `<span class="err">Couldn't load the numbers: ${esc(e.message)}</span>`;
    }
  }
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
