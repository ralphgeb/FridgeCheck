<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scout numbers</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#090909">
<style>
  /* Scout's numbers, in the Halo site's look. Live from the Scout service (/stats.json). */
  :root {
    color-scheme: dark;
    --bg: #090909;
    --card: #141414;
    --card-2: #1b1b1b;
    --ink: #f2f2ed;
    --ink-2: rgba(242, 242, 237, 0.62);
    --ink-3: rgba(242, 242, 237, 0.36);
    --line: rgba(242, 242, 237, 0.09);
    --accent: #ff6129;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 16px 56px; }
  h1 { font-size: clamp(32px, 7vw, 44px); letter-spacing: -1.2px; line-height: 1.05; margin: 0; }
  .sub { color: var(--ink-3); margin: 6px 0 24px; font-size: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin: 30px 0 10px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
  .big { font-size: clamp(34px, 8vw, 46px); font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .big small { font-size: 16px; color: var(--ink-3); font-weight: 500; letter-spacing: 0; }
  .bar { height: 10px; border-radius: 6px; background: var(--card-2); overflow: hidden; margin: 14px 0 8px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 6px; transition: width .8s cubic-bezier(.2, .8, .2, 1); }
  .note { color: var(--ink-2); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
  .tile .l { color: var(--ink-3); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .tile .v { font-size: 26px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .n { color: var(--ink-3); font-size: 12px; }
  ol { margin: 0; padding: 4px 4px 4px 22px; }
  li { padding: 7px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li span { color: var(--ink-3); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
  th, td { text-align: right; padding: 9px 6px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--ink-3); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  .empty { color: var(--ink-3); }
  .err { color: var(--accent); }
  .table { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Scout numbers</h1>
  <div class="sub" id="sub">Loading…</div>

  <h2>Voice · Google Text-to-Speech</h2>
  <div class="card">
    <div class="big" id="chars">–</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="note" id="cost"></div>
  </div>
  <div class="grid" style="margin-top:10px" id="voice"></div>

  <h2>Listening</h2>
  <div class="grid" id="plays"></div>

  <h2>Most played this month</h2>
  <div class="card"><ol id="top"></ol></div>

  <h2>News</h2>
  <div class="grid" id="news"></div>

  <h2>Last 14 days</h2>
  <div class="card table">
    <table>
      <thead><tr><th>Day</th><th>Updates</th><th>New stories</th><th>AI requests</th><th>Characters</th></tr></thead>
      <tbody id="days"></tbody>
    </table>
  </div>
</div>
<script>
  const SOURCE = 'https://scout-stocks.ralph-gebara.workers.dev/stats.json';
  const fmt = (n) => Number(n || 0).toLocaleString('en-GB');
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const tile = (label, value, note = '') =>
    `<div class="tile"><div class="l">${label}</div><div class="v">${value}</div>${note ? `<div class="n">${note}</div>` : ''}</div>`;
  const $ = (id) => document.getElementById(id);

  async function load() {
    try {
      const r = await fetch(SOURCE, { cache: 'no-store' });
      if (!r.ok) throw new Error(`the Scout service answered ${r.status}`);
      const d = await r.json();
      const month = new Date(d.month + '-01').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
      const updated = d.updated ? new Date(d.updated).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : 'not yet';
      $('sub').textContent = `${month} · last news update ${updated}`;

      const v = d.voice;
      $('chars').innerHTML = `${fmt(v.chars)} <small>of ${fmt(v.free)} free characters</small>`;
      $('bar').style.width = Math.min(100, v.chars / v.free * 100).toFixed(1) + '%';
      $('cost').textContent = v.over
        ? `About £${v.costGBP.toFixed(2)} over the free allowance this month`
        : `Inside the free allowance · ${fmt(v.free - v.chars)} characters left this month`;
      $('voice').innerHTML =
        tile('Briefings', fmt(v.briefings.chars), `${fmt(v.briefings.recordings)} recordings`) +
        tile('Top stories ahead', fmt(v.storiesAhead.chars), `${fmt(v.storiesAhead.stories)} stories`) +
        tile('Played on demand', fmt(v.onDemand.chars), `${fmt(v.onDemand.stories)} stories · cap ${fmt(v.onDemand.dailyCap)}/day`);

      $('plays').innerHTML = tile('Briefings played', fmt(d.plays.briefings)) + tile('Stories played', fmt(d.plays.stories));
      $('top').innerHTML = d.plays.top.length
        ? d.plays.top.map((t) => `<li>${esc(t.title)} <span>· ${esc(t.kind)} · ${fmt(t.n)}</span></li>`).join('')
        : '<li class="empty" style="list-style:none;margin-left:-22px">Nothing played yet this month.</li>';

      const n = d.news;
      $('news').innerHTML = tile('Updates', fmt(n.runs)) + tile('New stories', fmt(n.added)) +
        tile('Merged', fmt(n.merged)) + tile('Skipped', fmt(n.skipped)) + tile('AI requests', fmt(n.aiRequests));

      $('days').innerHTML = d.days.length
        ? d.days.map((x) => `<tr><td>${x.day.slice(8)}/${x.day.slice(5, 7)}</td><td>${fmt(x.runs)}</td><td>${fmt(x.added)}</td><td>${fmt(x.aiRequests)}</td><td>${fmt(x.chars)}</td></tr>`).join('')
        : '<tr><td class="empty" colspan="5">No days yet.</td></tr>';
    } catch (e) {
      $('sub').innerHTML = `<span class="err">Couldn't load the numbers: ${esc(e.message)}</span>`;
    }
  }
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
