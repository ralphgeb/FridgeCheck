<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06173d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plume">
<title>Plume Avios Wallet</title>
<meta name="description" content="Household Avios, tier points and vouchers, a reward calendar with pence-per-Avios value, and an earning optimiser.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-style app column with a fixed bottom tab bar. Each tab opens on a bold title, then a navy hero card, then white cards. */
:root {
  --bg: #f2f4f8;
  --card: #ffffff;
  --ink: #0e1726;
  --muted: #5f6b80;
  --line: #e3e8f0;
  --blue: #075aaa;
  --sky: #e7effa;
  --red: #d61f2b;
  --good: #0f8a5f;
  --good-soft: #e3f4ec;
  --warn: #b5590b;
  --warn-soft: #fbeedd;
  --hero-1: #06173d;
  --hero-2: #0a3a85;
  --on-hero: #ffffff;
  --on-hero-muted: #b8c7e3;
  --t-blue: #3b7be0;
  --t-bronze: #b4703c;
  --t-silver: #8f9aa8;
  --t-gold: #c99a1a;
  --shadow: 0 1px 2px rgb(14 23 38 / .05), 0 6px 20px rgb(14 23 38 / .06);
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060c18; --card: #0e182b; --ink: #eef2f8; --muted: #93a0b8; --line: #1c2840;
    --blue: #6aa8f5; --sky: #12223d; --red: #ff5b66; --good: #3ccf94; --good-soft: #0f2a22;
    --warn: #f3a35a; --warn-soft: #2e1f0f; --hero-1: #040d24; --hero-2: #0a2f6e;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #060c18; --card: #0e182b; --ink: #eef2f8; --muted: #93a0b8; --line: #1c2840;
  --blue: #6aa8f5; --sky: #12223d; --red: #ff5b66; --good: #3ccf94; --good-soft: #0f2a22;
  --warn: #f3a35a; --warn-soft: #2e1f0f; --hero-1: #040d24; --hero-2: #0a2f6e;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(100px + env(safe-area-inset-bottom, 0px));
}
.view { display: flex; flex-direction: column; gap: 14px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px 2px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: .95rem; letter-spacing: .02em; color: var(--muted); text-transform: uppercase; }
.brand svg { width: 26px; height: 26px; border-radius: 7px; }
h1 { font-size: 2rem; font-weight: 800; letter-spacing: -.03em; margin: 0; line-height: 1.1; }
h2 { font-size: 1.05rem; font-weight: 800; margin: 0; letter-spacing: -.01em; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 8px 2px 0; }
.sec-head small { color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }

/* Hero */
.hero {
  position: relative; overflow: hidden; border-radius: 24px; padding: 22px; color: var(--on-hero);
  background: radial-gradient(120% 140% at 100% 0%, var(--hero-2) 0%, var(--hero-1) 70%);
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px;
}
.hero .ribbon { position: absolute; right: -40px; bottom: -30px; width: 260px; height: 140px; pointer-events: none; opacity: .9; }
.hero .label { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--on-hero-muted); margin: 0; }
.hero .big { font-size: clamp(2.6rem, 11vw, 3.4rem); font-weight: 800; letter-spacing: -.04em; line-height: 1; margin: 0; }
.hero .big small { font-size: .38em; font-weight: 700; letter-spacing: 0; color: var(--on-hero-muted); margin-left: 6px; }
.hero .chips { display: flex; gap: 8px; flex-wrap: wrap; position: relative; }
.hchip { background: rgb(255 255 255 / .12); border: 1px solid rgb(255 255 255 / .16); color: var(--on-hero); border-radius: 999px; padding: 5px 11px; font-size: .82rem; font-weight: 600; }

/* Cards */
.card { background: var(--card); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.tight { gap: 8px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.avatar { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; color: #fff; flex: none; }
.name { font-weight: 700; font-size: 1.02rem; }
.sub { font-size: .84rem; color: var(--muted); }
.num-big { font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.num-big small { font-size: .55em; color: var(--muted); font-weight: 700; letter-spacing: 0; margin-left: 4px; }

.tier { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px 4px 8px; font-size: .78rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #fff; }
.tier::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: rgb(255 255 255 / .85); }
.tier.Blue { background: var(--t-blue); }
.tier.Bronze { background: linear-gradient(135deg, #c98b55, var(--t-bronze)); }
.tier.Silver { background: linear-gradient(135deg, #b3bcc7, var(--t-silver)); }
.tier.Gold { background: linear-gradient(135deg, #e3bd45, var(--t-gold)); }

.progress { height: 10px; border-radius: 999px; background: var(--sky); overflow: hidden; position: relative; }
.progress > span { display: block; height: 100%; border-radius: 999px; background: var(--blue); }
.progress.gold > span { background: linear-gradient(90deg, #e3bd45, var(--t-gold)); }
.progress.silver > span { background: linear-gradient(90deg, #b3bcc7, var(--t-silver)); }
.progress.bronze > span { background: linear-gradient(90deg, #c98b55, var(--t-bronze)); }
.tp-line { display: flex; justify-content: space-between; gap: 8px; font-size: .84rem; }
.tp-line b { font-weight: 800; }

.pill { display: inline-block; border-radius: 999px; padding: 3px 9px; font-size: .76rem; font-weight: 700; white-space: nowrap; background: var(--sky); color: var(--blue); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.red { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }

.vicon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--sky); color: var(--blue); }
.vicon svg { width: 22px; height: 22px; }
.vicon.companion { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); }
.vicon.upgrade { background: color-mix(in srgb, var(--t-gold) 18%, transparent); color: var(--t-gold); }
.vicon.travel { background: var(--good-soft); color: var(--good); }

.idea { background: linear-gradient(135deg, var(--sky), var(--card)); }
.kicker { font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--red); }
.idea p { margin: 0; font-size: 1rem; font-weight: 600; }

/* Controls */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 9px 6px; font-weight: 600; font-size: .86rem; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 800; box-shadow: var(--shadow); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; font-weight: 700; font-size: .84rem; white-space: nowrap; cursor: pointer; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.ctl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ctl > span { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.ctl-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.stepper { display: flex; align-items: center; background: var(--bg); border-radius: 14px; padding: 4px; }
.stepper button { width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--card); font-weight: 800; font-size: 1.1rem; cursor: pointer; box-shadow: var(--shadow); }
.stepper output { min-width: 44px; text-align: center; font-weight: 800; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
.toggle input { appearance: none; width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .15s; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .15s; }
.toggle input:checked { background: var(--blue); }
.toggle input:checked::after { transform: translateX(20px); }
.toggle input:disabled { opacity: .4; }
select.sel, input.inp {
  width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 12px; color: var(--ink);
}
input[type="range"] { width: 100%; accent-color: var(--blue); }

/* Destinations */
.dest { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.dest:first-child { border-top: 0; padding-top: 0; }
.code { width: 52px; height: 52px; border-radius: 14px; background: var(--sky); color: var(--blue); font-weight: 800; font-size: .95rem; display: grid; place-items: center; letter-spacing: .02em; }
.dest.ok .code { background: var(--blue); color: var(--card); }
.dest .price { text-align: right; font-weight: 800; }
.dest .price small { display: block; font-weight: 500; color: var(--muted); font-size: .78rem; }
.dest .bar { grid-column: 2 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dest .progress { height: 6px; flex: 1 1 120px; }
.dest.na { opacity: .5; }
.spot { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.spot:first-of-type { border-top: 0; padding-top: 0; }
.ppa { font-weight: 800; font-size: 1.15rem; text-align: right; }
.ppa small { display: block; font-size: .72rem; font-weight: 700; }
.v-ex { color: var(--good); } .v-good { color: var(--blue); } .v-ok { color: var(--warn); } .v-poor { color: var(--red); }

.big-stat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--bg); border-radius: 16px; padding: 12px; min-width: 0; }
.stat b { display: block; font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; }
.stat span { font-size: .76rem; color: var(--muted); font-weight: 600; }
.hero .big-stat .stat { background: rgb(255 255 255 / .1); }
.hero .big-stat .stat span { color: var(--on-hero-muted); }

.result { border-radius: 16px; padding: 14px; background: var(--bg); display: flex; flex-direction: column; gap: 6px; }
.result .num-big { font-size: 1.9rem; }
.result.ok { background: var(--good-soft); }
.result.no { background: var(--warn-soft); }

/* Calendar */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-head b { font-size: 1.05rem; font-weight: 800; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { font-size: .7rem; font-weight: 700; color: var(--muted); text-align: center; padding-bottom: 2px; }
.day { aspect-ratio: 1 / 1.08; max-width: 100%; border-radius: 10px; border: 2px solid transparent; background: var(--good-soft); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; padding: 0; position: relative; min-width: 0; }
.day b { font-size: .9rem; font-weight: 800; line-height: 1; }
.day small { font-size: .62rem; font-weight: 700; color: var(--muted); line-height: 1; }
.day.peak { background: var(--warn-soft); }
.day.past { opacity: .3; cursor: default; }
.day.blank { background: transparent; cursor: default; }
.day.seats { border-color: var(--blue); }
.day.none { background: var(--bg); }
.day.none b { text-decoration: line-through; color: var(--muted); }
.day i { position: absolute; top: -5px; right: -5px; background: var(--blue); color: var(--card); font-style: normal; font-size: .62rem; font-weight: 800; border-radius: 999px; min-width: 17px; height: 17px; padding: 0 4px; display: grid; place-items: center; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .76rem; color: var(--muted); font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend em { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.best { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.best::-webkit-scrollbar { display: none; }
.bd { flex: none; border-radius: 14px; padding: 10px 12px; background: var(--bg); min-width: 108px; display: flex; flex-direction: column; gap: 2px; border: 0; text-align: left; cursor: pointer; color: var(--ink); }
.bd b { font-weight: 800; }
.bd small { font-size: .74rem; color: var(--muted); font-weight: 600; }
.bd.top { background: var(--blue); color: var(--card); }
.bd.top small { color: var(--card); opacity: .85; }

/* Earn */
.earn { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 2px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.earn:first-child { border-top: 0; padding-top: 0; }
.earn .rate { grid-column: 2; font-weight: 800; color: var(--blue); font-size: .9rem; }
.earn p { grid-column: 2; margin: 0; font-size: .86rem; color: var(--muted); }
.opt { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.opt:first-of-type { border-top: 0; }
.opt .rank { width: 28px; height: 28px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-weight: 800; font-size: .85rem; }
.opt.win .rank { background: var(--blue); color: var(--card); }
.opt .val { text-align: right; font-weight: 800; font-size: 1.1rem; }
.opt .val small { display: block; font-size: .74rem; color: var(--muted); font-weight: 600; }
.opt .detail { grid-column: 2 / -1; font-size: .8rem; color: var(--muted); }

/* Trips */
.pass { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 96px; border: 0; padding: 0; text-align: left; cursor: pointer; width: 100%; }
.pass .main { padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pass .stub { border-left: 2px dashed var(--line); padding: 16px 12px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; gap: 8px; text-align: right; position: relative; }
.pass .stub::before, .pass .stub::after { content: ""; position: absolute; left: -10px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); }
.pass .stub::before { top: -9px; } .pass .stub::after { bottom: -9px; }
.route { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.route b { font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.route .line { height: 2px; background: var(--line); position: relative; }
.route .line svg { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); color: var(--blue); background: var(--card); padding: 0 2px; box-sizing: content-box; }
.route .cities { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-top: -4px; }
.who { display: flex; }
.who span { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 800; color: #fff; border: 2px solid var(--card); margin-left: -6px; }
.who span:first-child { margin-left: 0; }

/* Buttons */
.btn { border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 800; cursor: pointer; background: var(--sky); color: var(--blue); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; position: relative; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--blue); color: var(--card); }
.btn.danger { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); }
.btn.small { padding: 8px 12px; font-size: .84rem; border-radius: 11px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.btn.ai { background: linear-gradient(135deg, var(--blue), #7a4fd6); color: #fff; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; color: var(--blue); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.flat { box-shadow: none; background: var(--bg); width: 36px; height: 36px; }
.list-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.list-row:first-of-type { border-top: 0; padding-top: 0; }
.list-row .chev { color: var(--muted); font-weight: 800; }
.note { font-size: .84rem; color: var(--muted); margin: 0; }
.note b { color: var(--ink); }
.callout { background: var(--sky); border-radius: 16px; padding: 14px; font-size: .88rem; display: flex; gap: 10px; }
.callout svg { width: 20px; height: 20px; flex: none; color: var(--blue); margin-top: 1px; }
.empty { text-align: center; padding: 18px 8px; color: var(--muted); }
.demo-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 10px 12px; font-size: .84rem; font-weight: 700; }
.demo-bar button { border: 0; background: var(--card); color: var(--ink); border-radius: 10px; padding: 6px 10px; font-weight: 800; cursor: pointer; font-size: .8rem; }
.msg { font-size: .84rem; font-weight: 600; margin: 0; color: var(--muted); }
.msg.err { color: var(--red); } .msg.ok { color: var(--good); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: sp .8s linear infinite; display: inline-block; vertical-align: -3px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* Tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 2px 9px; color: var(--muted); text-decoration: none; font-size: .7rem; font-weight: 700; }
nav.tabs a svg { width: 24px; height: 24px; }
nav.tabs a[aria-current="page"] { color: var(--blue); }

/* Sheet */

  function viewRedeem() {

      .filter((d) => R.region === "All" || AIRPORTS[d.code][3] === R.region)
      .sort((a, b) => a.mi - b.mi);
    const offered = list.filter((d) => d.c);
    const ok = offered.filter((d) => d.c.avios <= p);
    const spots = sweetSpots(p, R.party, comp);

    const U = S.upgrade;
    const fromP = price(U.dest, U.from, U.season), toP = price(U.dest, U.to, U.season);
    const ci = (id) => CABINS.findIndex((c) => c.id === id);

    return `${top("Redeem")}
      <section class="hero">
        ${RIBBON}

      </section>

      <section class="card">
        <div class="card-head"><h2>Sweet spots</h2><span class="sub">Highest pence per Avios</span></div>
        ${spots.map((s) => { const [cl, lb] = rating(s.v); return `<button type="button" class="spot" data-spot="${s.code}|${s.cabin.id}">
          <div class="code" style="${s.ok ? "background:var(--blue);color:var(--card)" : ""}">${s.code}</div>
          <div style="min-width:0"><div class="name">${esc(AIRPORTS[s.code][0])} · ${s.cabin.name}</div><div class="sub">${av(s.avios)} Avios + ${GBP.format(s.tax)} · ${s.ok ? "in reach" : av(s.avios - p) + " short"}</div></div>
          <div class="ppa ${cl}">${s.v.toFixed(1)}p<small>${lb}</small></div></button>`; }).join("")}
        <p class="note">Business and First to long-haul usually give 2–3p per Avios. Short-haul Economy rarely beats 1p. Tap one to open its calendar.</p>
      </section>

      <section class="card">
        <div class="ctl"><span>Who's paying</span>
          <div class="chips">
            <button type="button" class="chip" data-payer="all" aria-pressed="${R.payer === "all"}">${S.household.pooled ? "Household" : "Best balance"}</button>
            ${S.members.map((m) => `<button type="button" class="chip" data-payer="${m.id}" aria-pressed="${R.payer === m.id}">${esc(m.name)}</button>`).join("")}
          </div>
        </div>
        <div class="ctl-row">
          <label class="toggle"><span><b>Companion Voucher</b><br><span class="sub">${hasComp ? (R.party >= 2 ? "Two travel for the Avios of one" : "Needs 2+ travellers") : "None in your wallet"}</span></span>
            <input type="checkbox" id="compT" ${comp ? "checked" : ""} ${hasComp && R.party >= 2 ? "" : "disabled"}></label>
          <div class="ctl"><span>Travellers</span>${stepper("step", R.party)}</div>
        </div>
      </section>

      ${viewCalendar(R, comp)}

      <div class="sec-head"><h2>Everywhere you can go</h2><small>From London</small></div>
      <section class="card">
        <div class="ctl"><span>Cabin</span>${seg("cabin", CABINS.map((c) => ({ v: c.id, l: c.short })), R.cabin)}</div>
        <div class="ctl"><span>Dates</span>${seg("season", [{ v: 0, l: "Off-peak" }, { v: 1, l: "Peak" }], R.season)}</div>
      </section>
      <div class="chips" role="group" aria-label="Region">${REGIONS.map((r) => `<button type="button" class="chip" data-region="${esc(r)}" aria-pressed="${R.region === r}">${esc(r)}</button>`).join("")}</div>
      <section class="card tight">${list.map((d) => destRow(d, p, R)).join("")}</section>

      <div class="sec-head"><h2>Upgrade with Avios</h2><small>Pay the difference</small></div>
      <section class="card">
        <label class="ctl"><span>Route</span><select class="sel" id="upDest">${DESTS.map((c) => `<option value="${c}" ${c === U.dest ? "selected" : ""}>London → ${esc(AIRPORTS[c][0])} (${c})</option>`).join("")}</select></label>
        <div class="ctl"><span>From</span>${seg("upFrom", CABINS.slice(0, 3).map((c) => ({ v: c.id, l: c.short, dis: !price(U.dest, c.id, 0) })), U.from)}</div>
        <div class="ctl"><span>To</span>${seg("upTo", CABINS.slice(1).map((c) => ({ v: c.id, l: c.short, dis: !price(U.dest, c.id, 0) })), U.to)}</div>
        <div class="ctl-row">
          <div class="ctl"><span>Journey</span>${seg("upWay", [{ v: 0, l: "Return" }, { v: 1, l: "One way" }], U.oneway ? 1 : 0)}</div>
          <div class="ctl"><span>Travellers</span>${stepper("upstep", U.party)}</div>

        ${upOk ? `<div class="result ${upPool >= upCost ? "ok" : "no"}">

            <div class="num-big">${av(upCost)}<small>Avios</small></div>
            <b>${upPool >= upCost ? `You can afford this. ${av(upPool - upCost)} Avios left after.` : `${av(upCost - upPool)} more Avios needed.`}</b>
            ${upVoucher && ci(U.to) - ci(U.from) === 1 ? `<span class="sub">Or use ${possessive(upVoucher.owner, "your")} Upgrade Voucher for free (expires ${fmtDate(upVoucher.expiry)}).</span>` : ""}
          </div>` : `<div class="result"><b>Pick a higher cabin than the one you're booked in.</b><span class="sub">Some routes only have Economy and Business.</span></div>`}
        <p class="note">Upgrades need reward seats in the higher cabin and an eligible fare. The cheapest Economy fares usually can't be upgraded.</p>
      </section>
      <p class="fine">Indicative Reward Flight Saver prices and peak dates from London, return per person. Seat data comes only from screenshots you import or days you mark. Check ba.com before booking.</p>`;
  }
  function destRow(d, p, R) {
    const [city] = AIRPORTS[d.code];
    const dist = `${N.format(Math.round(km(d.mi) / 10) * 10)} km`;
    if (!d.c) return `<div class="dest na"><div class="code">${d.code}</div><div><div class="name">${esc(city)}</div><div class="sub">${dist} · cabin not offered on this route</div></div><div class="price">–</div></div>`;
    const ok = d.c.avios <= p;
    const v = ppa(d.code, R.cabin, R.season), [cl] = rating(v);
    return `<div class="dest ${ok ? "ok" : ""}">
      <div class="code">${d.code}</div>
      <div style="min-width:0"><div class="name">${esc(city)}</div><div class="sub">${dist} · Zone ${d.c.zone} · <b class="${cl}">${v.toFixed(1)}p</b></div></div>
      <div class="price">${av(d.c.avios)}<small>+ ~${GBP.format(d.c.tax)}</small></div>
      <div class="bar">${ok ? `<span class="pill good">You can go · ${av(p - d.c.avios)} left</span>` : `<div class="progress"><span style="width:${Math.min(100, p / d.c.avios * 100)}%"></span></div><span class="sub">${av(d.c.avios - p)} more</span>`}</div>
    </div>`;
  }

  // ================= Earn =================
  function goalCost() {
    const G = S.goal, comp = G.companion && G.party >= 2;
    const cabin = price(G.dest, G.cabin, 0) ? G.cabin : "econ";
    return { ...cost(G.dest, cabin, 0, G.party, comp), cabin, comp, v: ppa(G.dest, cabin, 0) };
  }
  function optimiser() {
    const G = S.goal, E = S.earn, gc = goalCost();
    const vp = Math.min(3, Math.max(1, gc.v)); // value each Avios at your goal's rate, kept in a sane range
    const seat = price(G.dest, gc.cabin, 0).avios;
    const pe = price(G.dest, "prem", 0), ec = price(G.dest, "econ", 0);
    const up = pe && ec ? pe.avios - ec.avios : 10000;
    const yearSpend = G.spend * 12;
    return CARDS.map((c) => {
      const avios = yearSpend * c.rate + E.baSpend * c.baRate;
      const got = !!c.voucher && yearSpend + E.baSpend >= c.voucher.at;
      const vAvios = got ? (c.voucher.type === "companion" ? seat : up) : 0;
      const value = (avios + vAvios) * vp / 100 - c.fee;
      return { c, avios, got, vAvios, value, vp };
    }).sort((a, b) => b.value - a.value);
  }
  function viewEarn() {
    const G = S.goal, E = S.earn, card = CARDS.find((c) => c.id === G.card) || CARDS[0];
    const hasComp = activeVouchers("companion").length > 0;
    const gc = goalCost();
    const p = pool("all"), gap = Math.max(0, gc.avios - p);
    const monthly = G.spend * card.rate + E.baSpend / 12 * card.baRate;
    const months = gap === 0 ? 0 : monthly > 0 ? Math.ceil(gap / monthly) : Infinity;
    const when = isFinite(months) ? new Date(today().getFullYear(), today().getMonth() + months, 1).toLocaleDateString("en-GB", { month: "long", year: "numeric" }) : "";
    const pct = Math.min(100, p / gc.avios * 100);
    const opt = optimiser(), win = opt[0], mine = opt.find((o) => o.c.id === card.id);
    const buyP = Number(E.buyPrice) / 10; // £ per 1,000 → pence per Avios
    const expiring = S.members.map((m) => ({ m, x: expiryOf(m) })).filter((o) => o.x).sort((a, b) => a.x < b.x ? -1 : 1);

    return `${top("Earn")}
      <section class="hero">
        ${RIBBON}
        <p class="label">Your goal</p>
        <p class="big" style="font-size:clamp(2rem,9vw,2.8rem)">${esc(AIRPORTS[G.dest][0])}</p>
        <div class="chips"><span class="hchip">${CABINS.find((x) => x.id === gc.cabin).name}</span><span class="hchip">${G.party} ${G.party === 1 ? "traveller" : "travellers"}</span>${gc.comp ? `<span class="hchip">Companion Voucher</span>` : ""}<span class="hchip">${av(gc.avios)} Avios</span><span class="hchip">${gc.v.toFixed(1)}p each</span></div>
        <div class="progress" style="background:rgb(255 255 255 / .15)"><span style="width:${pct}%;background:var(--on-hero)"></span></div>
        <p class="label" style="text-transform:none;letter-spacing:0;font-weight:600">${gap === 0 ? "You already have enough. Time to book." : `${av(p)} of ${av(gc.avios)} · ${av(gap)} to go${isFinite(months) ? ` · about ${months} ${months === 1 ? "month" : "months"}` : ""}`}</p>
      </section>

      <section class="card">
        <div class="card-head"><h2>Goal planner</h2></div>
        <div class="two-col">
          <label class="ctl"><span>Where to</span><select class="sel" id="gDest">${DESTS.map((x) => `<option value="${x}" ${x === G.dest ? "selected" : ""}>${esc(AIRPORTS[x][0])}</option>`).join("")}</select></label>
          <label class="ctl"><span>Cabin</span><select class="sel" id="gCabin">${CABINS.map((x) => `<option value="${x.id}" ${x.id === gc.cabin ? "selected" : ""} ${price(G.dest, x.id, 0) ? "" : "disabled"}>${x.name}</option>`).join("")}</select></label>
        </div>
        <div class="ctl-row">
          <label class="toggle"><span><b>Companion Voucher</b><br><span class="sub">${hasComp ? "You have one" : "Plan as if you'll earn one"}</span></span><input type="checkbox" id="gComp" ${G.companion ? "checked" : ""} ${G.party >= 2 ? "" : "disabled"}></label>
          <div class="ctl"><span>Travellers</span>${stepper("gstep", G.party)}</div>
        </div>
        <label class="ctl"><span>Monthly card spend · <b style="color:var(--ink)" id="gSpendLbl">${GBP.format(G.spend)}</b></span><input type="range" id="gSpend" min="0" max="6000" step="100" value="${G.spend}"></label>
        <label class="ctl"><span>BA flights you pay for, per year · <b style="color:var(--ink)" id="baSpendLbl">${GBP.format(E.baSpend)}</b></span><input type="range" id="baSpend" min="0" max="15000" step="250" value="${E.baSpend}"></label>
        <label class="ctl"><span>Card you use</span><select class="sel" id="gCard">${CARDS.map((x) => `<option value="${x.id}" ${x.id === card.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
        <div class="result ${gap === 0 ? "ok" : ""}">
          ${gap === 0 ? `<div class="num-big">Ready now</div><span class="sub">Your household pool already covers it.</span>` :
            isFinite(months) ? `<span class="sub">Earning about ${av(monthly)} Avios a month on the card</span><div class="num-big">${months} ${months === 1 ? "month" : "months"}</div><b>You'd have enough by ${when}.</b>` :
            `<div class="num-big">Add some spend</div><span class="sub">Move the sliders to see how long it takes.</span>`}
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h2>Card optimiser</h2><span class="pill">Avios at ${win.vp.toFixed(1)}p</span></div>
        <p class="note">Net value a year at your spend: Avios plus any voucher, valued at your goal's pence per Avios, minus the annual fee.</p>
        ${opt.map((o, i) => `<div class="opt ${i === 0 ? "win" : ""}">
          <div class="rank">${i + 1}</div>
          <div class="name" style="min-width:0">${esc(o.c.name)}</div>
          <div class="val ${o.value >= 0 ? "" : "v-poor"}">${o.value >= 0 ? "" : "−"}${GBP.format(Math.abs(o.value))}<small>a year</small></div>
          <div class="detail">${av(o.avios)} Avios${o.got ? ` + ${VOUCHERS[o.c.voucher.type].name} (worth ~${av(o.vAvios)} Avios)` : o.c.voucher ? ` · voucher needs ${GBP.format(o.c.voucher.at)} a year` : ""} · fee ${GBP.format(o.c.fee)}</div>
        </div>`).join("")}
        <div class="callout">${I.card}<span>${win.c.id !== card.id ? `Switching to <b>${esc(win.c.name)}</b> is worth about <b>${GBP.format(win.value - mine.value)}</b> more a year at your spend.` : "Your card is already the best fit for this spend."}</span></div>
      </section>

      <section class="card">
        <div class="card-head"><h2>Should I buy Avios?</h2></div>
        <label class="ctl"><span>Sale price per 1,000 Avios (£)</span><input class="inp" id="buyPrice" type="number" min="1" step="0.5" value="${esc(E.buyPrice)}"></label>
        <div class="result ${buyP < gc.v ? "ok" : "no"}">
          <span class="sub">Buying costs ${buyP.toFixed(2)}p per Avios. Your goal gets ${gc.v.toFixed(2)}p.</span>
          <b>${buyP < gc.v ? (gap ? `Worth it to close the gap: ${av(gap)} Avios would cost about ${GBP.format(gap * buyP / 100)}.` : "Worth it, but you already have enough for this goal.") : "Not worth it for this goal. You'd pay more than the Avios save you."}</b>
        </div>
      </section>

      <section class="card tight">
        <div class="card-head"><h2>Expiry watch</h2>${I.clock}</div>
        <p class="note">Avios expire after 36 months with no earning or spending.</p>
        ${expiring.length ? expiring.map(({ m, x }) => `<div class="list-row" style="cursor:default"><div class="avatar" style="background:${esc(m.color)};width:36px;height:36px;border-radius:11px;font-size:.95rem">${esc(initials(m.name))}</div>
          <div style="flex:1;min-width:0"><div class="name">${esc(m.name)}</div><div class="sub">${av(m.avios)} Avios · safe until ${fmtDate(x)}</div></div>${expiryPill(x)}</div>`).join("") : `<p class="empty">Add a last activity date to each account in Settings.</p>`}
      </section>

      <div class="sec-head"><h2>Ways to earn more</h2><small>Typical rates</small></div>
      <section class="card tight">
        ${EARN.map((e) => `<div class="earn"><div class="vicon">${I[e.i]}</div><div class="name">${esc(e.t)}</div><div class="rate">${esc(e.r)}</div><p>${esc(e.d)}</p></div>`).join("")}
      </section>
      <p class="fine">Card rates, fees and voucher spend targets change often. Check the provider before you apply. This isn't financial advice.</p>`;
  }

  // ================= Trips =================
  function viewTrips() {
    const trips = S.trips.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    const dist = trips.reduce((s, t) => s + (AIRPORTS[t.from] && AIRPORTS[t.to] ? km(miles(t.from, t.to)) * 2 : 0), 0);
    const places = new Set(trips.map((t) => t.to)).size;
    const earned = trips.filter((t) => t.type === "paid").reduce((s, t) => s + (Number(t.avios) || 0), 0);
    const spent = trips.filter((t) => t.type === "reward").reduce((s, t) => s + (Number(t.avios) || 0), 0);
    const years = [...new Set(trips.map((t) => (t.date || "").slice(0, 4)))].filter(Boolean);

    return `${top("Trips", `<button type="button" class="icon-btn" data-act="addTrip" aria-label="Log a trip">${I.plus}</button>`)}
      <section class="hero">
        ${RIBBON}
        <p class="label">Distance flown</p>
        <p class="big">${N.format(Math.round(dist))}<small>km</small></p>
        <div class="big-stat">
          <div class="stat"><b>${trips.length}</b><span>trips</span></div>
          <div class="stat"><b>${places}</b><span>places</span></div>
          <div class="stat"><b>${(dist / 40075).toFixed(1)}×</b><span>around Earth</span></div>
        </div>
      </section>
      <section class="card">
        <div class="big-stat" style="grid-template-columns:1fr 1fr">
          <div class="stat"><b>${av(earned)}</b><span>Avios earned flying</span></div>
          <div class="stat"><b>${av(spent)}</b><span>Avios spent on rewards</span></div>
        </div>
      </section>
      ${trips.length ? years.map((y) => `<div class="sec-head"><h2>${y}</h2><small>${trips.filter((t) => t.date.startsWith(y)).length} trips</small></div>` +
        trips.filter((t) => t.date.startsWith(y)).map(passCard).join("")).join("") :
        `<section class="card"><p class="empty">No trips yet. Tap + to log one.</p></section>`}
      <button type="button" class="btn block" data-act="addTrip">${I.plus} Log a trip</button>`;
  }
  function passCard(t) {

    return `<button type="button" class="pass" data-act="trip" data-id="${t.id}">

        <div class="who">${(t.who || []).map((id) => member(id)).filter(Boolean).map((m) => `<span style="background:${esc(m.color)}" title="${esc(m.name)}">${esc(initials(m.name))}</span>`).join("")}</div>
        <span class="sub">${t.type === "reward" ? "−" : "+"}${av(t.avios || 0)}</span>

        ${S.members.map((m) => `<button type="button" class="list-row" data-act="member" data-id="${m.id}">
          <div class="avatar" style="background:${esc(m.color)}">${esc(initials(m.name))}</div>
          <div style="flex:1;min-width:0"><div class="name">${esc(m.name)}</div><div class="sub">${esc(m.tier)} · ${av(m.avios || 0)} Avios · ${av(m.tp || 0)} TP</div></div>
          <span class="chev">›</span></button>`).join("") || `<p class="empty">No accounts yet.</p>`}
        ${S.members.length < 7 ? `<button type="button" class="btn" data-act="addMember">${I.plus} Add account</button>` : ""}
      </section>

      <section class="card">
        <label class="toggle"><span><b>Household Account</b><br><span class="sub">Pool everyone's Avios for redemptions, like BA's Household Account.</span></span>
          <input type="checkbox" id="pooledT" ${S.household.pooled ? "checked" : ""}></label>
      </section>

      <div class="sec-head"><h2>Vouchers</h2><small>${S.vouchers.length} saved</small></div>
      <section class="card tight">
        ${S.vouchers.map((v) => voucherRow(v, false)).join("") || `<p class="empty">No vouchers saved.</p>`}
        <div class="btns">
          <button type="button" class="btn ai small" data-act="importVouchers" ${S.members.length ? "" : "disabled"}>${I.camera} Import from screenshots</button>
          <button type="button" class="btn small" data-act="addVoucher" ${S.members.length ? "" : "disabled"}>${I.plus} Add by hand</button>
        </div>
      </section>

      <div class="sec-head"><h2>Smart import</h2><small>${key ? "Connected" : "Not set up"}</small></div>
      <section class="card">
        <p class="note">Screenshot import uses Claude, Anthropic's AI. Paste your own API key from <b>console.anthropic.com</b>. Screenshots go from this browser straight to Anthropic; each import costs a few pence on your key.</p>
        <input class="inp" id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" value="${esc(key)}" aria-label="Anthropic API key">
        <div class="btns"><button type="button" class="btn small primary" data-act="saveKey">Save key</button>${key ? `<button type="button" class="btn small danger" data-act="forgetKey">Forget key</button>` : ""}</div>
      </section>

      <div class="sec-head"><h2>Your data</h2></div>
      <section class="card">
        <p class="note">Saved in this browser only. Back it up to move it to another phone. Your API key isn't included.</p>
        <div class="btns">
          <button type="button" class="btn small" data-act="export">Save backup</button>
          <label class="btn small">Load backup<input type="file" id="importF" accept="application/json,.json"></label>
          <button type="button" class="btn small" data-act="demo">Load example data</button>
          <button type="button" class="btn small danger" data-act="wipe">${wipeArmed ? "Tap again to erase" : "Erase everything"}</button>
        </div>
      </section>

      <section class="card tight">
        <h2>Add Plume to your home screen</h2>
        <p class="note">On iPhone, tap Share, then <b>Add to Home Screen</b>. On Android, open the browser menu and tap <b>Install app</b>.</p>
      </section>

      <section class="card tight">
        <h2>About the numbers</h2>
        <p class="note">Tier thresholds: Bronze ${av(3500)}, Silver ${av(7500)}, Gold ${av(20000)} Tier Points in a membership year. Reward prices are indicative Reward Flight Saver rates from London by distance zone, return per person. Peak dates follow UK school holidays. Pence per Avios uses typical cash fares unless you enter your own.</p>
      </section>
      <p class="fine">Plume is an independent tool. It isn't affiliated with, endorsed by or connected to British Airways or Avios.</p>`;
  }

  // ================= Sheets (forms) =================
  function openSheet(title, fieldsHtml, onSubmit, extra = "") {
    $("sheetHost").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="grab"></div><h2 style="font-size:1.4rem">${esc(title)}</h2>
      <form id="sheetForm">${fieldsHtml}<button class="btn primary block" type="submit">Save</button>${extra}
      <button class="btn block" type="button" data-close>Cancel</button></form></div></div>`;
    const close = () => { $("sheetHost").innerHTML = ""; };
    $("scrim").addEventListener("click", (e) => { if (e.target.id === "scrim" || e.target.hasAttribute("data-close")) close(); });
    $("sheetForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(e.target), o = {};
      for (const [k2, v] of fd.entries()) { if (k2 in o) o[k2] = [].concat(o[k2], v); else o[k2] = v; }
      onSubmit(o, e.target); close(); commit();
    });
    const del = $("sheetDel");
    if (del) del.addEventListener("click", () => {
      if (del.dataset.armed) { del._onDelete(); close(); commit(); }
      else { del.dataset.armed = "1"; del.textContent = "Tap again to delete"; }
    });
    return del;
  }
  const field = (label, html) => `<label class="f">${esc(label)}${html}</label>`;
  const inp = (name, val, type = "text", attrs = "") => `<input class="inp" name="${name}" type="${type}" value="${esc(val ?? "")}" ${attrs}>`;
  const sel = (name, opts, val) => `<select class="sel" name="${name}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(val) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  const delBtn = (label) => `<button class="btn danger block" type="button" id="sheetDel">${esc(label)}</button>`;
  const aiBox = (id, label) => `<label class="btn ai block">${I.camera} ${esc(label)}<input type="file" id="${id}" accept="image/*" multiple></label><p class="msg" id="${id}Msg">${getKey() ? "" : "Add your Anthropic API key in Settings › Smart import to use this."}</p>`;

  function editMember(m) {
    const isNew = !m;
    m = m || { id: uid(), name: "", number: "", tier: "Blue", avios: 0, tp: 0, lifetime: 0, tierEnd: "", lastActivity: "", color: COLORS[S.members.length % COLORS.length] };
    let pending = [];
    const del = openSheet(isNew ? "Add account" : "Edit " + m.name,
      aiBox("memImport", isNew ? "Fill from BA screenshots" : "Update from BA screenshots") +
      field("Name", inp("name", m.name, "text", 'required maxlength="30" placeholder="e.g. Sarah"')) +
      field("Membership number", inp("number", m.number, "text", 'inputmode="numeric" maxlength="12" placeholder="8 digits"')) +
      `<div class="two">${field("Tier", sel("tier", TIERS.map((t) => [t.name, t.name]), m.tier))}${field("Tier year ends", inp("tierEnd", m.tierEnd, "date"))}</div>` +
      `<div class="two">${field("Avios balance", inp("avios", m.avios, "number", 'min="0" step="1" inputmode="numeric"'))}${field("Last Avios activity", inp("lastActivity", m.lastActivity, "date"))}</div>` +
      `<div class="two">${field("Tier Points this year", inp("tp", m.tp, "number", 'min="0" step="1" inputmode="numeric"'))}${field("Lifetime Tier Points", inp("lifetime", m.lifetime, "number", 'min="0" step="1" inputmode="numeric"'))}</div>` +
      field("Colour", `<div class="checks">${COLORS.map((c) => `<label><input type="radio" name="color" value="${c}" ${c === m.color ? "checked" : ""}><span style="width:16px;height:16px;border-radius:50%;background:${c};display:inline-block"></span></label>`).join("")}</div>`),
      (o) => {
        Object.assign(m, { name: o.name.trim() || "Member", number: o.number.replace(/\D/g, ""), tier: o.tier, tierEnd: o.tierEnd, lastActivity: o.lastActivity,
          avios: Math.max(0, Number(o.avios) || 0), tp: Math.max(0, Number(o.tp) || 0), lifetime: Math.max(0, Number(o.lifetime) || 0), color: o.color || m.color });
        if (isNew) S.members.push(m);
        if (pending.length) { const n = addVouchers(pending.map((v) => ({ ...v, owner: m.id }))); if (n) setTimeout(() => toast(`Saved ${m.name} with ${n} ${n === 1 ? "voucher" : "vouchers"}`), 50); }
      }, isNew ? "" : delBtn("Remove account"));
    if (del) del._onDelete = () => {
      S.members = S.members.filter((x) => x.id !== m.id);
      S.vouchers = S.vouchers.filter((v) => v.owner !== m.id);
      S.trips.forEach((t) => { t.who = (t.who || []).filter((id) => id !== m.id); });
    };
    $("memImport").addEventListener("change", async (e) => {
      const files = e.target.files; if (!files || !files.length) return;
      const msg = $("memImportMsg"), f = $("sheetForm");
      msg.className = "msg"; msg.innerHTML = `<span class="spin"></span> Reading ${files.length} ${files.length === 1 ? "screenshot" : "screenshots"}…`;
      try {
        const r = await askClaude(files, accountPrompt());
        const set = (n, v) => { if (v != null && v !== "" && f.elements[n]) f.elements[n].value = v; };
        set("name", r.name); set("number", r.membership_number ? String(r.membership_number).replace(/\D/g, "") : null);
        if (TIERS.some((t) => t.name === r.tier)) set("tier", r.tier);
        set("avios", r.avios); set("tp", r.tier_points); set("lifetime", r.lifetime_tier_points);
        if (/^\d{4}-\d{2}-\d{2}$/.test(r.tier_end_date || "")) set("tierEnd", r.tier_end_date);
        if (/^\d{4}-\d{2}-\d{2}$/.test(r.last_activity_date || "")) set("lastActivity", r.last_activity_date);
        pending = cleanVouchers(r.vouchers, m.id);
        msg.className = "msg ok";
        msg.textContent = `Filled in from your screenshots${pending.length ? ` and found ${pending.length} ${pending.length === 1 ? "voucher" : "vouchers"}` : ""}. Check the details, then Save.`;
      } catch (err) { msg.className = "msg err"; msg.textContent = aiError(err); }
      e.target.value = "";
    });
  }
  function importVouchers() {
    let found = [];
    openSheet("Import vouchers",
      field("Whose vouchers", sel("owner", S.members.map((m) => [m.id, m.name]), S.members[0]?.id)) +
      aiBox("vImport", "Choose screenshots") + `<div id="vFound"></div>`,
      (o) => {
        const n = addVouchers(found.map((v) => ({ ...v, owner: o.owner })));
        setTimeout(() => toast(n ? `Added ${n} ${n === 1 ? "voucher" : "vouchers"}` : "No new vouchers to add"), 50);
      });
    $("vImport").addEventListener("change", async (e) => {
      const files = e.target.files; if (!files || !files.length) return;
      const msg = $("vImportMsg");
      msg.className = "msg"; msg.innerHTML = `<span class="spin"></span> Reading ${files.length} ${files.length === 1 ? "screenshot" : "screenshots"}…`;
      try {
        const r = await askClaude(files, voucherPrompt());
        found = cleanVouchers(r.vouchers, null);
        msg.className = found.length ? "msg ok" : "msg err";
        msg.textContent = found.length ? `Found ${found.length}. Tap Save to add them.` : "No vouchers found in those screenshots.";
        $("vFound").innerHTML = found.map((v) => `<div class="list-row" style="cursor:default"><div class="vicon ${v.type}">${I[v.type]}</div><div style="flex:1;min-width:0"><div class="name">${esc(VOUCHERS[v.type].name)}${v.value ? " · " + GBP.format(v.value) : ""}</div><div class="sub">${v.expiry ? "Expires " + fmtDate(v.expiry) : "No expiry shown"}${v.note ? " · " + esc(v.note) : ""}</div></div></div>`).join("");
      } catch (err) { msg.className = "msg err"; msg.textContent = aiError(err); }
      e.target.value = "";
    });
  }
  function editVoucher(v) {
    const isNew = !v;
    v = v || { id: uid(), owner: S.members[0]?.id, type: "companion", expiry: "", value: "", note: "" };
    const del = openSheet(isNew ? "Add voucher" : VOUCHERS[v.type]?.name || "Voucher",
      field("Type", sel("type", Object.entries(VOUCHERS).map(([k2, t]) => [k2, t.name]), v.type)) +
      field("Belongs to", sel("owner", S.members.map((m) => [m.id, m.name]), v.owner)) +
      `<div class="two">${field("Expires", inp("expiry", v.expiry, "date"))}${field("Value £ (travel vouchers)", inp("value", v.value, "number", 'min="0" step="1"'))}</div>` +
      field("Note", inp("note", v.note, "text", 'maxlength="60" placeholder="Optional"')),
      (o) => {
        Object.assign(v, { type: o.type, owner: o.owner, expiry: o.expiry, value: o.value, note: o.note.trim() });
        if (isNew) S.vouchers.push(v);
      }, isNew ? "" : delBtn("Delete voucher"));
    if (del) del._onDelete = () => { S.vouchers = S.vouchers.filter((x) => x.id !== v.id); };
  }
  function editTrip(t) {
    const isNew = !t;
    t = t || { id: uid(), from: "LHR", to: "JFK", date: iso(today()), cabin: "econ", who: S.members.map((m) => m.id), type: "paid", avios: "" };
    const ap = Object.keys(AIRPORTS).map((c) => [c, `${AIRPORTS[c][0]} (${c})`]);
    const del = openSheet(isNew ? "Log a trip" : `${t.from} → ${t.to}`,
      `<div class="two">${field("From", sel("from", ap, t.from))}${field("To", sel("to", ap, t.to))}</div>` +
      `<div class="two">${field("Date", inp("date", t.date, "date", "required"))}${field("Cabin", sel("cabin", CABINS.map((c) => [c.id, c.name]), t.cabin))}</div>` +
      `<div class="two">${field("Booking", sel("type", [["paid", "Paid (earned Avios)"], ["reward", "Reward (spent Avios)"]], t.type))}${field("Avios", inp("avios", t.avios, "number", 'min="0" step="1" inputmode="numeric"'))}</div>` +
      field("Who flew", `<div class="checks">${S.members.map((m) => `<label><input type="checkbox" name="who" value="${m.id}" ${(t.who || []).includes(m.id) ? "checked" : ""}>${esc(m.name)}</label>`).join("") || '<span class="sub">Add accounts in Settings first.</span>'}</div>`),
      (o) => {
        Object.assign(t, { from: o.from, to: o.to, date: o.date, cabin: o.cabin, type: o.type, avios: Math.max(0, Number(o.avios) || 0), who: [].concat(o.who || []) });
        if (isNew) S.trips.push(t);
      }, isNew ? "" : delBtn("Delete trip"));
    if (del) del._onDelete = () => { S.trips = S.trips.filter((x) => x.id !== t.id); };
  }

  async function importCalendar(files) {
    const C = S.cal, msg = $("calMsg");
    msg.className = "msg"; msg.innerHTML = `<span class="spin"></span> Reading ${files.length} ${files.length === 1 ? "screenshot" : "screenshots"}…`;
    try {
      const r = await askClaude(files, calPrompt(C.dest, C.cabin));
      const key = `${C.dest}|${C.cabin}`, map = S.avail[key] = S.avail[key] || {};
      let n = 0, firstDate = null;
      for (const d of Array.isArray(r.days) ? r.days : []) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date || "")) continue;
        map[d.date] = Math.max(0, Math.round(Number(d.seats) || 0)); n++;
        if (!firstDate || d.date < firstDate) firstDate = d.date;
      }
      if (firstDate) C.month = firstDate.slice(0, 7);
      if (S.demo) S.demo = false;
      save(); render();
      const m2 = $("calMsg");
      m2.className = n ? "msg ok" : "msg err";
      const seen = r.route_seen ? ` (screenshot shows ${String(r.route_seen).slice(0, 20)})` : "";
      m2.textContent = n ? `Added ${n} days of seat data${seen}.` : "No dates found. Try a screenshot of the reward calendar itself.";
    } catch (err) { msg.className = "msg err"; msg.textContent = aiError(err); }
  }

  // ================= Render + events =================
  let wipeArmed = false;
  function commit() { if (S.demo) S.demo = false; save(); render(); }
  function render(scrollTop) {
    const y = window.scrollY;
    const views = { wallet: viewWallet, redeem: viewRedeem, earn: viewEarn, trips: viewTrips, settings: viewSettings };
    $("view").innerHTML = views[tab]();
    renderTabs();
    window.scrollTo(0, scrollTop ? 0 : y);
  }
  function upd(fn) { fn(); save(); render(); }

  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, a");
    if (!t) return;
    const d = t.dataset;
    if (d.tab) { tab = d.tab; return; }
    if (d.act === "start") { tab = "settings"; history.replaceState(null, "", "#settings"); S = blank(); save(); render(true); editMember(); return; }
    if (d.act === "member") return editMember(member(d.id));
    if (d.act === "addMember") return editMember();
    if (d.act === "voucher") return editVoucher(S.vouchers.find((v) => v.id === d.id));
    if (d.act === "addVoucher") return editVoucher();
    if (d.act === "importVouchers") return importVouchers();
    if (d.act === "trip") return editTrip(S.trips.find((x) => x.id === d.id));
    if (d.act === "addTrip") return editTrip();
    if (d.act === "demo") return upd(() => { S = demo(); });
    if (d.act === "saveKey") { setKey($("apiKey").value.trim()); render(); toast(getKey() ? "API key saved on this device" : "API key removed"); return; }
    if (d.act === "forgetKey") { setKey(""); render(); toast("API key removed"); return; }
    if (d.act === "clearCal") return upd(() => { delete S.avail[`${S.cal.dest}|${S.cal.cabin}`]; });
    if (d.act === "wipe") {
      if (!wipeArmed) { wipeArmed = true; render(); setTimeout(() => { wipeArmed = false; if (tab === "settings") render(); }, 4000); return; }
      wipeArmed = false; return upd(() => { S = blank(); });
    }
    if (d.act === "export") {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "plume-backup.json"; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000); return;
    }
    if (d.payer) return upd(() => { S.redeem.payer = d.payer; });
    if (d.region) return upd(() => { S.redeem.region = d.region; });
    if (d.step) return upd(() => { S.redeem.party = Math.min(9, Math.max(1, S.redeem.party + Number(d.step))); });
    if (d.upstep) return upd(() => { S.upgrade.party = Math.min(9, Math.max(1, S.upgrade.party + Number(d.upstep))); });
    if (d.gstep) return upd(() => { S.goal.party = Math.min(9, Math.max(1, S.goal.party + Number(d.gstep))); });
    if (d.month) return upd(() => {
      const { y, mo } = calMonth();
      S.cal.month = iso(new Date(y, mo - 1 + Number(d.month), 1)).slice(0, 7);
    });
    if (d.jump) return upd(() => { S.cal.month = d.jump.slice(0, 7); });
    if (d.spot) {
      const [code, cabin] = d.spot.split("|");
      upd(() => { S.cal.dest = code; S.cal.cabin = cabin; S.cal.month = ""; });
      $("calCard")?.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    if (d.day) return upd(() => {
      // Cycle: unknown → seats seen → sold out → unknown
      const key = `${S.cal.dest}|${S.cal.cabin}`, map = S.avail[key] = S.avail[key] || {}, cur = map[d.day];
      if (cur == null) map[d.day] = Math.max(2, S.redeem.party);
      else if (cur > 0) map[d.day] = 0;
      else delete map[d.day];
    });
    if (d.seg) return upd(() => {
      const v = d.v;
      if (d.seg === "cabin") S.redeem.cabin = v;
      if (d.seg === "season") S.redeem.season = Number(v);
      if (d.seg === "upFrom") S.upgrade.from = v;
      if (d.seg === "upTo") S.upgrade.to = v;
      if (d.seg === "upWay") S.upgrade.oneway = v === "1";
    });
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.closest("#sheetHost")) return;
    if (t.id === "calImport") { const f = t.files; if (f && f.length) importCalendar(f); return; }
    if (t.id === "importF") {
      const f = t.files && t.files[0]; if (!f) return;
      f.text().then((txt) => {
        try {
          const o = JSON.parse(txt);
          if (!o || !Array.isArray(o.members)) throw 0;
          const base = blank();
          for (const k2 of ["redeem", "cal", "upgrade", "goal", "earn", "household"]) o[k2] = Object.assign(base[k2], o[k2] || {});
          S = Object.assign(base, o, { demo: false }); save(); render(); toast("Backup loaded");
        } catch { toast("That file isn't a Plume backup"); }
      });
      return;
    }
    const map = {
      compT: () => { S.redeem.companion = t.checked; },
      pooledT: () => { S.household.pooled = t.checked; },
      upDest: () => { S.upgrade.dest = t.value; if (!price(t.value, S.upgrade.from, 0)) S.upgrade.from = "econ"; if (!price(t.value, S.upgrade.to, 0)) S.upgrade.to = "club"; },
      calDest: () => { S.cal.dest = t.value; if (!price(t.value, S.cal.cabin, 0)) S.cal.cabin = "club"; },
      calCabin: () => { S.cal.cabin = t.value; },
      calCash: () => { const v = Math.max(0, Number(t.value) || 0); const key = `${S.cal.dest}|${S.cal.cabin}`; if (v) S.cash[key] = v; else delete S.cash[key]; },
      gDest: () => { S.goal.dest = t.value; if (!price(t.value, S.goal.cabin, 0)) S.goal.cabin = "club"; },
      gCabin: () => { S.goal.cabin = t.value; },
      gCard: () => { S.goal.card = t.value; },
      gComp: () => { S.goal.companion = t.checked; },
      gSpend: () => { S.goal.spend = Number(t.value); },
      baSpend: () => { S.earn.baSpend = Number(t.value); },
      buyPrice: () => { S.earn.buyPrice = Math.max(0.5, Number(t.value) || 16.5); },
    };
    if (map[t.id]) upd(map[t.id]);
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "gSpend") $("gSpendLbl").textContent = GBP.format(Number(e.target.value));
    if (e.target.id === "baSpend") $("baSpendLbl").textContent = GBP.format(Number(e.target.value));
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("sheetHost").innerHTML = ""; });

  render();
})();
</script>
</body>
</html>
