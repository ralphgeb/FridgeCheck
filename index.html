<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2a66">
<title>Plume Avios Wallet</title>
<meta name="description" content="Track your household's Avios, tier points and vouchers, see where they can take you, plan upgrades, and log your trips.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-style app column with a fixed bottom tab bar. Each tab opens on a bold title, then a navy hero card, then white cards. */
:root {
  --bg: #f2f4f8;
  --card: #ffffff;
  --ink: #0e1726;
  --muted: #5f6b80;
  --line: #e3e8f0;
  --blue: #075aaa;
  --sky: #e7effa;
  --red: #d61f2b;
  --good: #0f8a5f;
  --good-soft: #e3f4ec;
  --warn: #b5590b;
  --warn-soft: #fbeedd;
  --hero-1: #06173d;
  --hero-2: #0a3a85;
  --on-hero: #ffffff;
  --on-hero-muted: #b8c7e3;
  --t-blue: #3b7be0;
  --t-bronze: #b4703c;
  --t-silver: #8f9aa8;
  --t-gold: #c99a1a;
  --shadow: 0 1px 2px rgb(14 23 38 / .05), 0 6px 20px rgb(14 23 38 / .06);
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060c18; --card: #0e182b; --ink: #eef2f8; --muted: #93a0b8; --line: #1c2840;
    --blue: #6aa8f5; --sky: #12223d; --red: #ff5b66; --good: #3ccf94; --good-soft: #0f2a22;
    --warn: #f3a35a; --warn-soft: #2e1f0f; --hero-1: #040d24; --hero-2: #0a2f6e;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #060c18; --card: #0e182b; --ink: #eef2f8; --muted: #93a0b8; --line: #1c2840;
  --blue: #6aa8f5; --sky: #12223d; --red: #ff5b66; --good: #3ccf94; --good-soft: #0f2a22;
  --warn: #f3a35a; --warn-soft: #2e1f0f; --hero-1: #040d24; --hero-2: #0a2f6e;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(100px + env(safe-area-inset-bottom, 0px));
}
.view { display: flex; flex-direction: column; gap: 14px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px 2px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: .95rem; letter-spacing: .02em; color: var(--muted); text-transform: uppercase; }
.brand svg { width: 22px; height: 22px; }
h1 { font-size: 2rem; font-weight: 800; letter-spacing: -.03em; margin: 0; line-height: 1.1; }
h2 { font-size: 1.05rem; font-weight: 800; margin: 0; letter-spacing: -.01em; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 8px 2px 0; }
.sec-head small { color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }

/* Hero */
.hero {
  position: relative; overflow: hidden; border-radius: 24px; padding: 22px; color: var(--on-hero);
  background: radial-gradient(120% 140% at 100% 0%, var(--hero-2) 0%, var(--hero-1) 70%);
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px;
}
.hero .ribbon { position: absolute; right: -40px; bottom: -30px; width: 260px; height: 140px; pointer-events: none; opacity: .9; }
.hero .label { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--on-hero-muted); margin: 0; }
.hero .big { font-size: clamp(2.6rem, 11vw, 3.4rem); font-weight: 800; letter-spacing: -.04em; line-height: 1; margin: 0; }
.hero .big small { font-size: .38em; font-weight: 700; letter-spacing: 0; color: var(--on-hero-muted); margin-left: 6px; }
.hero .chips { display: flex; gap: 8px; flex-wrap: wrap; position: relative; }
.hchip { background: rgb(255 255 255 / .12); border: 1px solid rgb(255 255 255 / .16); color: var(--on-hero); border-radius: 999px; padding: 5px 11px; font-size: .82rem; font-weight: 600; }

/* Cards */
.card { background: var(--card); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.tight { gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.avatar { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; color: #fff; flex: none; }
.name { font-weight: 700; font-size: 1.02rem; }
.sub { font-size: .84rem; color: var(--muted); }
.num-big { font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.num-big small { font-size: .55em; color: var(--muted); font-weight: 700; letter-spacing: 0; margin-left: 4px; }

.tier { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px 4px 8px; font-size: .78rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #fff; }
.tier::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: rgb(255 255 255 / .85); }
.tier.Blue { background: var(--t-blue); }
.tier.Bronze { background: linear-gradient(135deg, #c98b55, var(--t-bronze)); }
.tier.Silver { background: linear-gradient(135deg, #b3bcc7, var(--t-silver)); }
.tier.Gold { background: linear-gradient(135deg, #e3bd45, var(--t-gold)); }

.progress { height: 10px; border-radius: 999px; background: var(--sky); overflow: hidden; position: relative; }
.progress > span { display: block; height: 100%; border-radius: 999px; background: var(--blue); }
.progress.gold > span { background: linear-gradient(90deg, #e3bd45, var(--t-gold)); }
.progress.silver > span { background: linear-gradient(90deg, #b3bcc7, var(--t-silver)); }
.progress.bronze > span { background: linear-gradient(90deg, #c98b55, var(--t-bronze)); }
.tp-line { display: flex; justify-content: space-between; gap: 8px; font-size: .84rem; }
.tp-line b { font-weight: 800; }

.pill { display: inline-block; border-radius: 999px; padding: 3px 9px; font-size: .76rem; font-weight: 700; white-space: nowrap; background: var(--sky); color: var(--blue); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.red { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }

.vicon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--sky); color: var(--blue); }
.vicon svg { width: 22px; height: 22px; }
.vicon.companion { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); }
.vicon.upgrade { background: color-mix(in srgb, var(--t-gold) 18%, transparent); color: var(--t-gold); }
.vicon.travel { background: var(--good-soft); color: var(--good); }

.idea { border-left: 0; background: linear-gradient(135deg, var(--sky), var(--card)); }
.idea .kicker { font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--red); }
.idea p { margin: 0; font-size: 1rem; font-weight: 600; }

/* Controls */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 9px 6px; font-weight: 600; font-size: .86rem; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 800; box-shadow: var(--shadow); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; font-weight: 700; font-size: .84rem; white-space: nowrap; cursor: pointer; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.ctl { display: flex; flex-direction: column; gap: 6px; }
.ctl > span { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.ctl-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; }
.stepper { display: flex; align-items: center; background: var(--bg); border-radius: 14px; padding: 4px; }
.stepper button { width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--card); font-weight: 800; font-size: 1.1rem; cursor: pointer; box-shadow: var(--shadow); }
.stepper output { min-width: 44px; text-align: center; font-weight: 800; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
.toggle input { appearance: none; width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .15s; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .15s; }
.toggle input:checked { background: var(--blue); }
.toggle input:checked::after { transform: translateX(20px); }
.toggle input:disabled { opacity: .4; }
select.sel, input.inp {
  width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 12px; color: var(--ink);
}
input[type="range"] { width: 100%; accent-color: var(--blue); }

/* Destinations */
.dest { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.dest:first-child { border-top: 0; padding-top: 0; }
.code { width: 52px; height: 52px; border-radius: 14px; background: var(--sky); color: var(--blue); font-weight: 800; font-size: .95rem; display: grid; place-items: center; letter-spacing: .02em; }
.dest.ok .code { background: var(--blue); color: var(--card); }
.dest .price { text-align: right; font-weight: 800; }
.dest .price small { display: block; font-weight: 500; color: var(--muted); font-size: .78rem; }
.dest .bar { grid-column: 2 / -1; }
.dest .progress { height: 6px; }
.dest.na { opacity: .5; }

.big-stat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--bg); border-radius: 16px; padding: 12px; min-width: 0; }
.stat b { display: block; font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; }
.stat span { font-size: .76rem; color: var(--muted); font-weight: 600; }
.hero .big-stat .stat { background: rgb(255 255 255 / .1); }
.hero .big-stat .stat span { color: var(--on-hero-muted); }

.result { border-radius: 16px; padding: 14px; background: var(--bg); display: flex; flex-direction: column; gap: 6px; }
.result .num-big { font-size: 1.9rem; }
.result.ok { background: var(--good-soft); }
.result.no { background: var(--warn-soft); }

/* Earn */
.earn { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 2px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.earn:first-child { border-top: 0; padding-top: 0; }
.earn .rate { grid-column: 2; font-weight: 800; color: var(--blue); font-size: .9rem; }
.earn p { grid-column: 2; margin: 0; font-size: .86rem; color: var(--muted); }

/* Trips */
.pass { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 96px; }
.pass .main { padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pass .stub { border-left: 2px dashed var(--line); padding: 16px 12px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; gap: 8px; text-align: right; position: relative; }
.pass .stub::before, .pass .stub::after { content: ""; position: absolute; left: -10px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); }
.pass .stub::before { top: -9px; } .pass .stub::after { bottom: -9px; }
.route { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.route b { font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.route .line { height: 2px; background: var(--line); position: relative; }
.route .line svg { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); color: var(--blue); background: var(--card); padding: 0 2px; box-sizing: content-box; }
.route .cities { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-top: -4px; }
.who { display: flex; }
.who span { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 800; color: #fff; border: 2px solid var(--card); margin-left: -6px; }
.who span:first-child { margin-left: 0; }

/* Buttons */
.btn { border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 800; cursor: pointer; background: var(--sky); color: var(--blue); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--blue); color: var(--card); }
.btn.danger { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); }
.btn.small { padding: 8px 12px; font-size: .84rem; border-radius: 11px; }
.btn.block { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; color: var(--blue); }
.icon-btn svg { width: 20px; height: 20px; }
.list-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.list-row:first-of-type { border-top: 0; padding-top: 0; }
.list-row .chev { color: var(--muted); font-weight: 800; }
.note { font-size: .84rem; color: var(--muted); margin: 0; }
.note b { color: var(--ink); }
.callout { background: var(--sky); border-radius: 16px; padding: 14px; font-size: .88rem; display: flex; gap: 10px; }
.callout svg { width: 20px; height: 20px; flex: none; color: var(--blue); margin-top: 1px; }
.empty { text-align: center; padding: 18px 8px; color: var(--muted); }
.demo-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 10px 12px; font-size: .84rem; font-weight: 700; }
.demo-bar button { border: 0; background: var(--card); color: var(--ink); border-radius: 10px; padding: 6px 10px; font-weight: 800; cursor: pointer; font-size: .8rem; }

/* Tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 2px 9px; color: var(--muted); text-decoration: none; font-size: .7rem; font-weight: 700; }
nav.tabs a svg { width: 24px; height: 24px; }
nav.tabs a[aria-current="page"] { color: var(--blue); }
nav.tabs a[aria-current="page"] svg { transform: translateY(-1px); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgb(4 10 24 / .45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--card); width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; max-height: 90vh; overflow: auto;
  padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(30px); opacity: .5; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet .grab { width: 40px; height: 5px; border-radius: 999px; background: var(--line); align-self: center; margin-top: -6px; }
.sheet form { display: flex; flex-direction: column; gap: 12px; }
.sheet label.f { display: flex; flex-direction: column; gap: 6px; font-size: .8rem; font-weight: 700; color: var(--muted); }
.sheet .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.checks { display: flex; gap: 8px; flex-wrap: wrap; }
.checks label { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 700; color: var(--ink); cursor: pointer; font-size: .86rem; }
.checks input { accent-color: var(--blue); }
.fine { font-size: .76rem; color: var(--muted); text-align: center; margin: 6px 8px 0; }
</style>
</head>

      <div class="sub">${esc(m ? m.name : "Unassigned")}${v.expiry ? " · expires " + fmtDate(v.expiry) : ""}${v.note && !compact ? " · " + esc(v.note) : ""}</div></div>
      ${expiryPill(v.expiry)}
    </button>`;
  }

  // ================= Redeem =================
  function seg(name, opts, val) {
    return `<div class="seg" role="group">${opts.map((o) => `<button type="button" data-seg="${name}" data-v="${o.v}" aria-pressed="${String(o.v) === String(val)}" ${o.dis ? "disabled" : ""}>${o.l}</button>`).join("")}</div>`;
  }
  function viewRedeem() {
    const R = S.redeem, hasComp = activeVouchers("companion").length > 0;
    if (R.payer !== "all" && !member(R.payer)) R.payer = "all";
    const comp = hasComp && R.companion && R.party >= 2;
    const p = pool(R.payer);
    let list = DESTS.map((code) => ({ code, c: cost(code, R.cabin, R.season, R.party, comp), mi: miles(ORIGIN, code) }))
      .filter((d) => R.region === "All" || AIRPORTS[d.code][3] === R.region)
      .sort((a, b) => a.mi - b.mi);
    const offered = list.filter((d) => d.c);
    const ok = offered.filter((d) => d.c.avios <= p);
    const furthest = ok[ok.length - 1];

    const U = S.upgrade;
    const fromP = price(U.dest, U.from, U.season), toP = price(U.dest, U.to, U.season);
    const upOk = fromP && toP && CABINS.findIndex((c) => c.id === U.to) > CABINS.findIndex((c) => c.id === U.from);
    const upCost = upOk ? (toP.avios - fromP.avios) * (U.oneway ? 0.5 : 1) * U.party : 0;
    const upVoucher = activeVouchers("upgrade")[0];
    const upPool = pool("all");

    return `${top("Redeem")}
      <section class="hero">
        ${RIBBON}
        <p class="label">${R.payer === "all" ? (S.household.pooled ? "Household pool" : "Largest single balance") : esc(member(R.payer).name) + "'s balance"}</p>
        <p class="big">${av(p)}<small>Avios</small></p>
        <div class="chips"><span class="hchip">${ok.length} of ${offered.length} destinations in reach</span>${furthest ? `<span class="hchip">Furthest: ${esc(AIRPORTS[furthest.code][0])}</span>` : ""}</div>
      </section>

      <section class="card">
        <div class="ctl"><span>Who's paying</span>
          <div class="chips">
            <button type="button" class="chip" data-payer="all" aria-pressed="${R.payer === "all"}">${S.household.pooled ? "Household" : "Best balance"}</button>
            ${S.members.map((m) => `<button type="button" class="chip" data-payer="${m.id}" aria-pressed="${R.payer === m.id}">${esc(m.name)}</button>`).join("")}
          </div>
        </div>
        <div class="ctl"><span>Cabin</span>${seg("cabin", CABINS.map((c) => ({ v: c.id, l: c.short })), R.cabin)}</div>
        <div class="ctl-row">
          <div class="ctl"><span>Dates</span>${seg("season", [{ v: 0, l: "Off-peak" }, { v: 1, l: "Peak" }], R.season)}</div>
          <div class="ctl"><span>Travellers</span><div class="stepper"><button type="button" data-step="-1" aria-label="Fewer travellers">−</button><output>${R.party}</output><button type="button" data-step="1" aria-label="More travellers">+</button></div></div>
        </div>
        <label class="toggle"><span><b>Use Companion Voucher</b><br><span class="sub">${hasComp ? (R.party >= 2 ? "Two travel for the Avios of one" : "Needs at least 2 travellers") : "No active voucher in your wallet"}</span></span>
          <input type="checkbox" id="compT" ${comp ? "checked" : ""} ${hasComp && R.party >= 2 ? "" : "disabled"}></label>
      </section>

      <div class="chips" role="group" aria-label="Region">${REGIONS.map((r) => `<button type="button" class="chip" data-region="${esc(r)}" aria-pressed="${R.region === r}">${esc(r)}</button>`).join("")}</div>

      <section class="card tight">
        ${list.map((d) => destRow(d, p)).join("")}
      </section>

      <div class="sec-head"><h2>Upgrade with Avios</h2><small>Pay the difference</small></div>
      <section class="card">
        <label class="ctl"><span>Route</span><select class="sel" id="upDest">${DESTS.filter((c) => zoneOf(c) >= 1).map((c) => `<option value="${c}" ${c === U.dest ? "selected" : ""}>London → ${esc(AIRPORTS[c][0])} (${c})</option>`).join("")}</select></label>
        <div class="ctl"><span>From</span>${seg("upFrom", CABINS.slice(0, 3).map((c) => ({ v: c.id, l: c.short, dis: !price(U.dest, c.id, 0) })), U.from)}</div>
        <div class="ctl"><span>To</span>${seg("upTo", CABINS.slice(1).map((c) => ({ v: c.id, l: c.short, dis: !price(U.dest, c.id, 0) })), U.to)}</div>
        <div class="ctl-row">
          <div class="ctl"><span>Journey</span>${seg("upWay", [{ v: 0, l: "Return" }, { v: 1, l: "One way" }], U.oneway ? 1 : 0)}</div>
          <div class="ctl"><span>Travellers</span><div class="stepper"><button type="button" data-upstep="-1" aria-label="Fewer travellers">−</button><output>${U.party}</output><button type="button" data-upstep="1" aria-label="More travellers">+</button></div></div>
        </div>
        ${upOk ? `<div class="result ${upPool >= upCost ? "ok" : "no"}">
            <span class="sub">${CABINS.find((c) => c.id === U.from).name} → ${CABINS.find((c) => c.id === U.to).name}, ${U.oneway ? "one way" : "return"}, ${U.party} ${U.party === 1 ? "traveller" : "travellers"}</span>
            <div class="num-big">${av(upCost)}<small>Avios</small></div>
            <b>${upPool >= upCost ? `You can afford this. ${av(upPool - upCost)} Avios left after.` : `${av(upCost - upPool)} more Avios needed.`}</b>
            ${upVoucher && CABINS.findIndex((c) => c.id === U.to) - CABINS.findIndex((c) => c.id === U.from) === 1 ? `<span class="sub">Or use ${member(upVoucher.owner) ? esc(member(upVoucher.owner).name) + "'s" : "your"} Upgrade Voucher for free (expires ${fmtDate(upVoucher.expiry)}).</span>` : ""}
          </div>` : `<div class="result"><b>Pick a higher cabin than the one you're booked in.</b><span class="sub">Some routes only have Economy and Business.</span></div>`}
        <p class="note">Upgrades need reward seats in the higher cabin and an eligible fare. The cheapest Economy fares usually can't be upgraded.</p>
      </section>
      <p class="fine">Indicative Reward Flight Saver prices from London, return per person. Check ba.com for live availability and exact taxes.</p>`;
  }
  function destRow(d, p) {
    const [city, , , region] = AIRPORTS[d.code];
    const dist = `${N.format(Math.round(km(d.mi) / 10) * 10)} km`;
    if (!d.c) return `<div class="dest na"><div class="code">${d.code}</div><div><div class="name">${esc(city)}</div><div class="sub">${dist} · cabin not offered on this route</div></div><div class="price">–</div></div>`;
    const ok = d.c.avios <= p;
    const pct = Math.min(100, p / d.c.avios * 100);
    return `<div class="dest ${ok ? "ok" : ""}">
      <div class="code">${d.code}</div>
      <div style="min-width:0"><div class="name">${esc(city)}</div><div class="sub">${dist} · Zone ${d.c.zone}</div></div>
      <div class="price">${av(d.c.avios)}<small>+ ~${TAX_GBP.format(d.c.tax)}</small></div>
      <div class="bar">${ok ? `<span class="pill good">You can go · ${av(p - d.c.avios)} left</span>` : `<div class="progress"><span style="width:${pct}%"></span></div><div class="sub" style="margin-top:4px">${av(d.c.avios - p)} more Avios</div>`}</div>
    </div>`;
  }

  // ================= Earn =================
  function viewEarn() {
    const G = S.goal, card = CARDS.find((c) => c.id === G.card) || CARDS[0];
    const hasComp = activeVouchers("companion").length > 0;
    const comp = G.companion && G.party >= 2;
    const c = cost(G.dest, G.cabin, 0, G.party, comp) || cost(G.dest, "econ", 0, G.party, comp);
    const p = pool("all"), gap = Math.max(0, c.avios - p);
    const monthly = G.spend * card.rate;
    const months = gap === 0 ? 0 : monthly > 0 ? Math.ceil(gap / monthly) : Infinity;
    const when = isFinite(months) ? new Date(today().getFullYear(), today().getMonth() + months, 1).toLocaleDateString("en-GB", { month: "long", year: "numeric" }) : "";
    const vMonths = card.voucher && G.spend > 0 ? Math.ceil(card.voucher.at / G.spend) : null;
    const pct = Math.min(100, p / c.avios * 100);
    const cabinOk = price(G.dest, G.cabin, 0);

    return `${top("Earn")}
      <section class="hero">
        ${RIBBON}
        <p class="label">Your goal</p>
        <p class="big" style="font-size:clamp(2rem,9vw,2.8rem)">${esc(AIRPORTS[G.dest][0])}</p>
        <div class="chips"><span class="hchip">${(cabinOk ? CABINS.find((x) => x.id === G.cabin) : CABINS[0]).name}</span><span class="hchip">${G.party} ${G.party === 1 ? "traveller" : "travellers"}</span>${comp ? `<span class="hchip">With Companion Voucher</span>` : ""}<span class="hchip">${av(c.avios)} Avios</span></div>
        <div class="progress" style="background:rgb(255 255 255 / .15)"><span style="width:${pct}%;background:var(--on-hero)"></span></div>
        <p class="label" style="text-transform:none;letter-spacing:0;font-weight:600">${gap === 0 ? "You already have enough. Time to book." : `${av(p)} of ${av(c.avios)} · ${av(gap)} to go`}</p>
      </section>

      <section class="card">
        <h2>Goal planner</h2>
        <label class="ctl"><span>Where to</span><select class="sel" id="gDest">${DESTS.map((x) => `<option value="${x}" ${x === G.dest ? "selected" : ""}>${esc(AIRPORTS[x][0])} (${x})</option>`).join("")}</select></label>
        <div class="ctl"><span>Cabin</span>${seg("gCabin", CABINS.map((x) => ({ v: x.id, l: x.short, dis: !price(G.dest, x.id, 0) })), cabinOk ? G.cabin : "econ")}</div>
        <div class="ctl-row">
          <label class="toggle" style="align-self:center"><span><b>Companion Voucher</b><br><span class="sub">${hasComp ? "You have one" : "Plan as if you'll earn one"}</span></span><input type="checkbox" id="gComp" ${G.companion ? "checked" : ""} ${G.party >= 2 ? "" : "disabled"}></label>
          <div class="ctl"><span>Travellers</span><div class="stepper"><button type="button" data-gstep="-1" aria-label="Fewer travellers">−</button><output>${G.party}</output><button type="button" data-gstep="1" aria-label="More travellers">+</button></div></div>
        </div>
        <label class="ctl"><span>Main card</span><select class="sel" id="gCard">${CARDS.map((x) => `<option value="${x.id}" ${x.id === card.id ? "selected" : ""}>${esc(x.name)} · ${x.rate} per £1</option>`).join("")}</select></label>
        <label class="ctl"><span>Monthly card spend · <b style="color:var(--ink)" id="gSpendLbl">${TAX_GBP.format(G.spend)}</b></span><input type="range" id="gSpend" min="0" max="6000" step="100" value="${G.spend}"></label>
        <div class="result ${gap === 0 ? "ok" : ""}">
          ${gap === 0 ? `<div class="num-big">Ready now</div><span class="sub">Your household pool already covers it.</span>` :
            isFinite(months) ? `<span class="sub">At ${av(monthly)} Avios a month</span><div class="num-big">${months} ${months === 1 ? "month" : "months"}</div><b>You'd have enough by ${when}.</b>` :
            `<div class="num-big">Add some spend</div><span class="sub">Move the slider to see how long it takes.</span>`}
          ${vMonths ? `<span class="sub">At this spend you'd also unlock the ${card.voucher.what} in about ${vMonths} ${vMonths === 1 ? "month" : "months"} (${TAX_GBP.format(card.voucher.at)} a year).</span>` : ""}
        </div>
      </section>

      <div class="sec-head"><h2>Ways to earn more</h2><small>Typical rates</small></div>
      <section class="card tight">
        ${EARN.map((e) => `<div class="earn"><div class="vicon">${I[e.i]}</div><div class="name">${esc(e.t)}</div><div class="rate">${esc(e.r)}</div><p>${esc(e.d)}</p></div>`).join("")}
      </section>
      <p class="fine">Earn rates and offers change often. Check the provider before you apply or spend. This isn't financial advice.</p>`;
  }

  // ================= Trips =================
  function viewTrips() {
    const trips = S.trips.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    const dist = trips.reduce((s, t) => s + (AIRPORTS[t.from] && AIRPORTS[t.to] ? km(miles(t.from, t.to)) * 2 : 0), 0);
    const places = new Set(trips.map((t) => t.to)).size;
    const earned = trips.filter((t) => t.type === "paid").reduce((s, t) => s + (Number(t.avios) || 0), 0);
    const spent = trips.filter((t) => t.type === "reward").reduce((s, t) => s + (Number(t.avios) || 0), 0);
    const years = [...new Set(trips.map((t) => (t.date || "").slice(0, 4)))].filter(Boolean);

    return `${top("Trips", `<button type="button" class="icon-btn" data-act="addTrip" aria-label="Add a trip">${I.plus}</button>`)}
      <section class="hero">
        ${RIBBON}
        <p class="label">Distance flown</p>
        <p class="big">${N.format(Math.round(dist))}<small>km</small></p>
        <div class="big-stat">
          <div class="stat"><b>${trips.length}</b><span>trips</span></div>
          <div class="stat"><b>${places}</b><span>places</span></div>
          <div class="stat"><b>${(dist / 40075).toFixed(1)}×</b><span>around Earth</span></div>
        </div>
      </section>
      <section class="card">
        <div class="big-stat" style="grid-template-columns:1fr 1fr">
          <div class="stat"><b>${av(earned)}</b><span>Avios earned flying</span></div>
          <div class="stat"><b>${av(spent)}</b><span>Avios spent on rewards</span></div>
        </div>
      </section>
      ${trips.length ? years.map((y) => `<div class="sec-head"><h2>${y}</h2><small>${trips.filter((t) => t.date.startsWith(y)).length} trips</small></div>` +
        trips.filter((t) => t.date.startsWith(y)).map(passCard).join("")).join("") :
        `<section class="card"><p class="empty">No trips yet. Tap + to log one.</p></section>`}
      <button type="button" class="btn block" data-act="addTrip">${I.plus} Log a trip</button>`;
  }
  function passCard(t) {
    const from = AIRPORTS[t.from] || [t.from], to = AIRPORTS[t.to] || [t.to];
    const cab = CABINS.find((c) => c.id === t.cabin) || CABINS[0];
    const d = AIRPORTS[t.from] && AIRPORTS[t.to] ? N.format(Math.round(km(miles(t.from, t.to)) / 10) * 10) + " km" : "";
    return `<button type="button" class="pass" data-act="trip" data-id="${t.id}" style="border:0;padding:0;text-align:left;cursor:pointer;width:100%">
      <div class="main">
        <div class="route"><b>${esc(t.from)}</b><div class="line">${I.plane}</div><b>${esc(t.to)}</b>
          <div class="cities"><span>${esc(from[0])}</span><span>${esc(to[0])}</span></div></div>
        <div class="row" style="gap:8px;flex-wrap:wrap"><span class="pill">${cab.name}</span><span class="pill ${t.type === "reward" ? "red" : "good"}">${t.type === "reward" ? "Reward" : "Paid"}</span><span class="sub">${d} each way</span></div>
      </div>
      <div class="stub">
        <span class="sub"><b style="color:var(--ink);font-size:1rem">${fmtDate(t.date, { day: "numeric", month: "short" })}</b><br>${(t.date || "").slice(0, 4)}</span>
        <div class="who">${(t.who || []).map((id) => member(id)).filter(Boolean).map((m) => `<span style="background:${esc(m.color)}" title="${esc(m.name)}">${esc(initials(m.name))}</span>`).join("")}</div>
        <span class="sub">${t.type === "reward" ? "−" : "+"}${av(t.avios || 0)}</span>
      </div>
    </button>`;
  }

  // ================= Settings =================

    return `${top("Settings")}
      <div class="callout">${I.lock}<span><b>How linking works.</b> British Airways doesn't let outside apps read your account, so Plume never asks for your BA password. Add each person's membership number and copy their balances from the BA app or ba.com. Everything stays on this device.</span></div>

  // ================= Sheets (forms) =================
  function openSheet(title, fieldsHtml, onSubmit, extra = "") {
    $("sheetHost").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="grab"></div><h2 style="font-size:1.4rem">${esc(title)}</h2>
      <form id="sheetForm">${fieldsHtml}<button class="btn primary block" type="submit">Save</button>${extra}
      <button class="btn block" type="button" data-close>Cancel</button></form></div></div>`;
    const close = () => { $("sheetHost").innerHTML = ""; };
    $("scrim").addEventListener("click", (e) => { if (e.target.id === "scrim" || e.target.hasAttribute("data-close")) close(); });
    $("sheetForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(e.target), o = {};
      for (const [k, v] of fd.entries()) { if (k in o) o[k] = [].concat(o[k], v); else o[k] = v; }
      onSubmit(o, e.target); close(); commit();
    });
    const del = $("sheetDel");
    if (del) del.addEventListener("click", () => {
      if (del.dataset.armed) { del._onDelete(); close(); commit(); }
      else { del.dataset.armed = "1"; del.textContent = "Tap again to delete"; }
    });
    return del;
  }
  const field = (label, html) => `<label class="f">${esc(label)}${html}</label>`;
  const inp = (name, val, type = "text", attrs = "") => `<input class="inp" name="${name}" type="${type}" value="${esc(val ?? "")}" ${attrs}>`;
  const sel = (name, opts, val) => `<select class="sel" name="${name}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(val) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  const delBtn = (label) => `<button class="btn danger block" type="button" id="sheetDel">${esc(label)}</button>`;

  function editMember(m) {
    const isNew = !m;
    m = m || { id: uid(), name: "", number: "", tier: "Blue", avios: 0, tp: 0, lifetime: 0, tierEnd: "", color: COLORS[S.members.length % COLORS.length] };
    const del = openSheet(isNew ? "Add account" : "Edit " + m.name,
      field("Name", inp("name", m.name, "text", 'required maxlength="30" placeholder="e.g. Sarah"')) +
      field("Membership number", inp("number", m.number, "text", 'inputmode="numeric" maxlength="12" placeholder="8 digits"')) +
      `<div class="two">${field("Tier", sel("tier", TIERS.map((t) => [t.name, t.name]), m.tier))}${field("Tier year ends", inp("tierEnd", m.tierEnd, "date"))}</div>` +
      field("Avios balance", inp("avios", m.avios, "number", 'min="0" step="1" inputmode="numeric"')) +
      `<div class="two">${field("Tier Points this year", inp("tp", m.tp, "number", 'min="0" step="1" inputmode="numeric"'))}${field("Lifetime Tier Points", inp("lifetime", m.lifetime, "number", 'min="0" step="1" inputmode="numeric"'))}</div>` +
      field("Colour", `<div class="checks">${COLORS.map((c) => `<label><input type="radio" name="color" value="${c}" ${c === m.color ? "checked" : ""}><span style="width:16px;height:16px;border-radius:50%;background:${c};display:inline-block"></span></label>`).join("")}</div>`),
      (o) => {
        Object.assign(m, { name: o.name.trim() || "Member", number: o.number.replace(/\D/g, ""), tier: o.tier, tierEnd: o.tierEnd,
          avios: Math.max(0, Number(o.avios) || 0), tp: Math.max(0, Number(o.tp) || 0), lifetime: Math.max(0, Number(o.lifetime) || 0), color: o.color || m.color });
        if (isNew) S.members.push(m);
      }, isNew ? "" : delBtn("Remove account"));
    if (del) del._onDelete = () => {
      S.members = S.members.filter((x) => x.id !== m.id);
      S.vouchers = S.vouchers.filter((v) => v.owner !== m.id);
      S.trips.forEach((t) => { t.who = (t.who || []).filter((id) => id !== m.id); });
    };
  }
  function editVoucher(v) {
    const isNew = !v;
    v = v || { id: uid(), owner: S.members[0]?.id, type: "companion", expiry: "", value: "", note: "" };
    const del = openSheet(isNew ? "Add voucher" : VOUCHERS[v.type]?.name || "Voucher",
      field("Type", sel("type", Object.entries(VOUCHERS).map(([k, t]) => [k, t.name]), v.type)) +
      field("Belongs to", sel("owner", S.members.map((m) => [m.id, m.name]), v.owner)) +
      `<div class="two">${field("Expires", inp("expiry", v.expiry, "date"))}${field("Value (£, travel vouchers)", inp("value", v.value, "number", 'min="0" step="1"'))}</div>` +
      field("Note", inp("note", v.note, "text", 'maxlength="60" placeholder="Optional"')),
      (o) => {
        Object.assign(v, { type: o.type, owner: o.owner, expiry: o.expiry, value: o.value, note: o.note.trim() });
        if (isNew) S.vouchers.push(v);
      }, isNew ? "" : delBtn("Delete voucher"));
    if (del) del._onDelete = () => { S.vouchers = S.vouchers.filter((x) => x.id !== v.id); };
  }
  function editTrip(t) {
    const isNew = !t;
    t = t || { id: uid(), from: "LHR", to: "JFK", date: new Date().toISOString().slice(0, 10), cabin: "econ", who: S.members.map((m) => m.id), type: "paid", avios: "" };
    const ap = Object.keys(AIRPORTS).map((c) => [c, `${AIRPORTS[c][0]} (${c})`]);
    const del = openSheet(isNew ? "Log a trip" : `${t.from} → ${t.to}`,
      `<div class="two">${field("From", sel("from", ap, t.from))}${field("To", sel("to", ap, t.to))}</div>` +
      `<div class="two">${field("Date", inp("date", t.date, "date", "required"))}${field("Cabin", sel("cabin", CABINS.map((c) => [c.id, c.name]), t.cabin))}</div>` +
      `<div class="two">${field("Booking", sel("type", [["paid", "Paid (earned Avios)"], ["reward", "Reward (spent Avios)"]], t.type))}${field("Avios", inp("avios", t.avios, "number", 'min="0" step="1" inputmode="numeric"'))}</div>` +
      field("Who flew", `<div class="checks">${S.members.map((m) => `<label><input type="checkbox" name="who" value="${m.id}" ${(t.who || []).includes(m.id) ? "checked" : ""}>${esc(m.name)}</label>`).join("") || '<span class="sub">Add accounts in Settings first.</span>'}</div>`),
      (o) => {
        Object.assign(t, { from: o.from, to: o.to, date: o.date, cabin: o.cabin, type: o.type, avios: Math.max(0, Number(o.avios) || 0), who: [].concat(o.who || []) });
        if (isNew) S.trips.push(t);
      }, isNew ? "" : delBtn("Delete trip"));
    if (del) del._onDelete = () => { S.trips = S.trips.filter((x) => x.id !== t.id); };
  }

  // ================= Render + events =================
  let wipeArmed = false;
  function commit() {
    if (S.demo) S.demo = false;
    save(); render();
  }
  function render(scrollTop) {
    const y = window.scrollY;
    const views = { wallet: viewWallet, redeem: viewRedeem, earn: viewEarn, trips: viewTrips, settings: viewSettings };
    $("view").innerHTML = views[tab]();
    renderTabs();
    window.scrollTo(0, scrollTop ? 0 : y);
  }

  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, a");
    if (!t) return;
    const d = t.dataset;
    if (d.tab) { tab = d.tab; return; }
    if (d.act === "start") { tab = "settings"; history.replaceState(null, "", "#settings"); S = { ...demo(), demo: false, members: [], vouchers: [], trips: [] }; save(); render(true); editMember(); return; }
    if (d.act === "member") return editMember(member(d.id));
    if (d.act === "addMember") return editMember();
    if (d.act === "voucher") return editVoucher(S.vouchers.find((v) => v.id === d.id));
    if (d.act === "addVoucher") return editVoucher();
    if (d.act === "trip") return editTrip(S.trips.find((x) => x.id === d.id));
    if (d.act === "addTrip") return editTrip();
    if (d.act === "demo") { S = demo(); save(); render(); return; }
    if (d.act === "wipe") {
      if (!wipeArmed) { wipeArmed = true; render(); setTimeout(() => { wipeArmed = false; if (tab === "settings") render(); }, 4000); return; }
      wipeArmed = false; S = { ...demo(), demo: false, members: [], vouchers: [], trips: [] }; save(); render(); return;
    }
    if (d.act === "export") {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "plume-backup.json"; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000); return;
    }
    if (d.payer) { S.redeem.payer = d.payer; save(); render(); return; }
    if (d.region) { S.redeem.region = d.region; save(); render(); return; }
    if (d.step) { S.redeem.party = Math.min(9, Math.max(1, S.redeem.party + Number(d.step))); save(); render(); return; }
    if (d.upstep) { S.upgrade.party = Math.min(9, Math.max(1, S.upgrade.party + Number(d.upstep))); save(); render(); return; }
    if (d.gstep) { S.goal.party = Math.min(9, Math.max(1, S.goal.party + Number(d.gstep))); save(); render(); return; }
    if (d.seg) {
      const v = d.v;
      if (d.seg === "cabin") S.redeem.cabin = v;
      if (d.seg === "season") S.redeem.season = Number(v);
      if (d.seg === "upFrom") S.upgrade.from = v;
      if (d.seg === "upTo") S.upgrade.to = v;
      if (d.seg === "upWay") S.upgrade.oneway = v === "1";
      if (d.seg === "gCabin") S.goal.cabin = v;
      save(); render();
    }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "compT") S.redeem.companion = t.checked;
    else if (t.id === "pooledT") S.household.pooled = t.checked;
    else if (t.id === "upDest") {
      S.upgrade.dest = t.value;
      if (!price(t.value, S.upgrade.from, 0)) S.upgrade.from = "econ";
      if (!price(t.value, S.upgrade.to, 0)) S.upgrade.to = "club";
    }
    else if (t.id === "gDest") { S.goal.dest = t.value; if (!price(t.value, S.goal.cabin, 0)) S.goal.cabin = "club"; }
    else if (t.id === "gCard") S.goal.card = t.value;
    else if (t.id === "gComp") S.goal.companion = t.checked;
    else if (t.id === "gSpend") S.goal.spend = Number(t.value);
    else if (t.id === "importF") {
      const f = t.files && t.files[0]; if (!f) return;
      f.text().then((txt) => {
        try {
          const o = JSON.parse(txt);
          if (!o || !Array.isArray(o.members)) throw 0;
          S = Object.assign(demo(), o, { demo: false }); save(); render();
          $("dataMsg").textContent = "Backup loaded.";
        } catch { $("dataMsg").textContent = "That file isn't a Plume backup."; }
      });
      return;
    }
    else return;
    save(); render();
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "gSpend") $("gSpendLbl").textContent = TAX_GBP.format(Number(e.target.value));
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("sheetHost").innerHTML = ""; });

  render();
})();
</script>
</body>
</html>
