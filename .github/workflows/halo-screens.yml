name: Halo – screenshots in the simulators

# Run by hand: builds Halo for the simulator and photographs every tab on the iPhone Duo (and an
# ordinary iPhone), with the sample data shown clearly. The pictures are in the run's artifacts.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: HaloApp
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest released Xcode
        run: |
          best=""; bestv=0
          for x in $(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE "beta|rc|preview"); do
            v=$(DEVELOPER_DIR="$x/Contents/Developer" xcodebuild -version 2>/dev/null | awk 'NR==1{print $2}')
            n=$(echo "$v" | awk -F. '{printf "%d%03d%03d", $1, $2, $3}')
            if [ -n "$v" ] && [ "$n" -gt "$bestv" ]; then best=$x; bestv=$n; fi
          done
          if [ -n "$best" ]; then sudo xcode-select -s "$best/Contents/Developer"; fi
          xcodebuild -version

      - name: What the simulators offer
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devicetypes
          echo "== simctl commands about folding:"; xcrun simctl help 2>&1 | grep -iE "fold|posture|hinge|display" || true
          xcrun simctl help io 2>&1 | grep -iE "fold|posture|display|screen" || true

      - name: Build for the simulator
        run: |
          brew install xcodegen
          xcodegen generate
          set -o pipefail
          xcodebuild build -project Halo.xcodeproj -scheme Halo -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tail -5

      - name: Photograph every tab, on every screen
        run: |
          set +e
          APP=$(ls -d build/Build/Products/Debug-iphonesimulator/Halo.app)
          rm -rf ../screens; mkdir -p ../screens
          xcrun simctl help io
          # iOS runtimes, newest first (the iPhone Duo has its own, e.g. iOS-27-2-iPhone19-4)
          xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]
          r.sort(key=lambda x:([int(p) for p in x['version'].split('.')], 'iPhone' in x['identifier']), reverse=True)
          print('\\n'.join(x['identifier'] for x in r))" > runtimes.txt
          cat runtimes.txt
          for PAIR in "com.apple.CoreSimulator.SimDeviceType.iPhone-Duo|duo" "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro|iphone"; do
            TYPE=${PAIR%%|*}; SLUG=${PAIR##*|}
            UDID=""
            while read -r RT; do
              UDID=$(xcrun simctl create "$SLUG" "$TYPE" "$RT" 2>/dev/null) && { echo "$SLUG on $RT"; break; }
            done < runtimes.txt
            [ -z "$UDID" ] && { echo "::warning::No runtime for $TYPE"; continue; }
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --batteryState charged --cellularBars 4 --wifiBars 3
            xcrun simctl install "$UDID" "$APP"
            echo "== screens of $SLUG"; xcrun simctl io "$UDID" enumerate > screens.txt
            # the phone's own screens ("Display class: 0"), named by their size: the Duo has an
            # outside one and a larger inside one; an ordinary iPhone just the one
            python3 - > internal.txt <<'PY'
          import re
          ports = open("screens.txt").read().split("Port:")
          for p in ports:
              u = re.search(r"UUID: ([0-9A-F-]{36})", p)
              if u and "Display class: 0" in p:
                  w = re.search(r"Default width: (\d+)", p); h = re.search(r"Default height: (\d+)", p)
                  print(u.group(1), int(w.group(1)) * int(h.group(1)) if w and h else 0)
          PY
            sort -k2 -n internal.txt | tee internal.sorted
            COUNT=$(grep -c . internal.sorted)
            I=0
            while read -r D AREA; do
              I=$((I+1))
              if [ "$COUNT" -gt 1 ]; then
                SCREEN=$([ "$I" -eq 1 ] && echo outside || echo inside)
                while read -r O _; do
                  if [ "$O" = "$D" ]; then P=on; else P=off; fi
                  xcrun simctl io "$UDID" screenConfig --display="$O" power $P
                done < internal.sorted
                sleep 5
              else
                SCREEN=screen
              fi
              for T in 0 1 2 3; do
                NAME=$(echo "today fitness health sleep" | cut -d' ' -f$((T+1)))
                xcrun simctl terminate "$UDID" com.ralphgeb.halo 2>/dev/null
                xcrun simctl launch "$UDID" com.ralphgeb.halo -onboarded YES -haloScreenshots -haloTab $T
                sleep 8
                xcrun simctl io "$UDID" screenshot --display="$D" "../screens/$SLUG-$SCREEN-$T-$NAME.png"
              done
            done < internal.sorted
            xcrun simctl shutdown "$UDID"
          done
          ls -la ../screens

      - name: Keep the pictures in the repository (HaloApp/screens)
        working-directory: .
        run: |
          mkdir -p HaloApp/screens
          rm -f HaloApp/screens/duo-* HaloApp/screens/iphone-screen-*
          cp screens/* HaloApp/screens/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HaloApp/screens
          git diff --cached --quiet && exit 0
          git commit -m "Halo: simulator screenshots"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"
