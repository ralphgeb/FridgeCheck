name: Halo – commit the generated Xcode project

# Run by hand: makes Halo.xcodeproj (and its Info.plists and entitlements) from project.yml with
# XcodeGen and commits them, so the project opens straight from a clone (for Xcode Cloud's set-up).
# Xcode Cloud makes them fresh again before every build (HaloApp/ci_scripts/ci_post_clone.sh).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: HaloApp
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Halo.xcodeproj Sources/Info.plist Widget/Info.plist Sources/App.entitlements Widget/Widget.entitlements
          git diff --cached --quiet && { echo "Nothing changed"; exit 0; }
          git commit -m "Halo: generated Xcode project (from project.yml)"
          git push
