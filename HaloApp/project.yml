name: Halo
options:
  bundleIdPrefix: com.ralphgeb
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"      # the workflow overrides this with the run number
    CODE_SIGN_STYLE: Automatic
    # Google OAuth client for iOS (Google Auth Platform > Clients > "Halo iOS").
    # Not a secret: iOS clients have no client secret.
    GOOGLE_CLIENT_ID: "94050104553-876cam76fuffpsgne8a9o6gh8r12tlv8.apps.googleusercontent.com"
    GOOGLE_REVERSED_CLIENT_ID: "com.googleusercontent.apps.94050104553-876cam76fuffpsgne8a9o6gh8r12tlv8"
    # Halo's Whoop sign-in service (HaloApp/whoop-worker), printed by the "Whoop sign-in service" workflow.
    WHOOP_AUTH_URL: "https://halo-whoop.ralph-gebara.workers.dev"

targets:
  Halo:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    dependencies:
      - target: HaloWidgetExtension      # embeds the widget inside the app
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Halo
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.ralphgeb.halo.refresh
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Halo reads your sleep, heart rate, HRV, activity, workouts and vitals from Apple Health to work out your recovery, effort and sleep scores. Nothing leaves your iPhone.
        NSHealthUpdateUsageDescription: Halo only reads from Apple Health and never writes to it.
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        WhoopAuthURL: $(WHOOP_AUTH_URL)
        CFBundleURLTypes:
          - CFBundleURLName: GoogleSignIn
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
          - CFBundleURLName: Halo
            CFBundleURLSchemes:
              - halo
    entitlements:
      path: Sources/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ralphgeb.halo
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralphgeb.halo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # the color sets' icons, chosen in Settings (tools/make_icon.py draws them)
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Ocean AppIcon-Forest AppIcon-Mono AppIcon-Dusk AppIcon-Sand AppIcon-Light"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  HaloWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Halo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ralphgeb.halo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralphgeb.halo.widget
        TARGETED_DEVICE_FAMILY: "1"
